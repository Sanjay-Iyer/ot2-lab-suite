# Expected final state of user-test SOP 1 (basic dilution).
# Administrator material: the machine-readable half of SOP_TESTER_ANSWER_KEY.md. Checked by
# src/agents/dye_demo/sop_check.py (scripts/check_ai_dye_demo_sop.py, tests/test_ai_dye_demo_user_test_sops.py).
#
#   settings  every conversation-editable setting and the value the run must use
#   choices   settings the tester may choose (one_of / between / at_or_after)
#   ignored   display names only; any value passes
#   plan      what src/agents/dye_demo/plan.py must derive from that configuration
#             print_steps: [FROM plate well, TO paper position, drops, µL per drop]
sop: 1
title: Basic dilution
difficulty: 1
start_config: configs/workflows/defaults/ai_agent_dilution_print_demo.yaml
ignored: [materials.sample.label, materials.solvent.label]
runs:
  - name: run 1 (dilutions with the default print)
    settings:
      deck.plate.slot: 4
      deck.paper.slot: 5
      deck.tuberack.slot: 7
      deck.tiprack.slot: 9
      materials.sample.vial: B1
      materials.solvent.vial: A1
      dilution.enabled: true
      dilution.factors: [2, 4, 8, 16]
      dilution.plate_column: "11"
      dilution.start_row: A
      dilution.total_volume_ul: 200
      dilution.prepared_volume_ul: null
      mixing.reps: 2
      mixing.volume_ul: 15
      print.enabled: true
      print.droplet_volume_ul: 5
      print.droplets_per_spot: 1
      print.replicates: 1
      print.paper_start_column: 1
      tips.start_tip: A1
      tips.return_tips: false
      tips.policy: per_liquid
    plan:
      makes_dilutions: true
      prints: true
      source_wells: {A11: 2, B11: 4, C11: 8, D11: 16}
      print_steps:
        - [A11, A1, 1, 5]
        - [B11, B1, 1, 5]
        - [C11, C1, 1, 5]
        - [D11, D1, 1, 5]
      transfers: 43
      total_drops: 4
      tips: [A1, B1, C1, D1, E1, F1]
