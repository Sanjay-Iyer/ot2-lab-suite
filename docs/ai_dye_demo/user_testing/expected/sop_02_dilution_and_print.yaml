# Expected final state of user-test SOP 2 (dilution and print). See sop_01_basic_dilution.yaml for the format.
sop: 2
title: Dilution and print
difficulty: 2
start_config: configs/workflows/defaults/ai_agent_dilution_print_demo.yaml
ignored: [materials.sample.label, materials.solvent.label]
runs:
  - name: run 1 (three dilutions, two stacked drops in paper column 2)
    settings:
      deck.plate.slot: 4
      deck.paper.slot: 5
      deck.tuberack.slot: 7
      deck.tiprack.slot: 9
      materials.sample.vial: A2
      materials.solvent.vial: A1
      dilution.enabled: true
      dilution.factors: [5, 10, 20]
      dilution.plate_column: "11"
      dilution.start_row: A
      dilution.rows: null
      dilution.total_volume_ul: 150
      dilution.prepared_volume_ul: null
      mixing.reps: 2
      mixing.volume_ul: 15
      mixing.enabled: true
      liquid_handling.air_gap_ul: 1.0
      liquid_handling.blow_out: true
      liquid_handling.well_plate_shake.enabled: true
      print.enabled: true
      print.droplet_volume_ul: 5
      print.droplets_per_spot: 2
      print.replicates: 1
      print.paper_start_column: 2
      print.paper_rows: null
      print.source_map: null
      tips.start_tip: A1
      tips.return_tips: true
      tips.policy: single_tip
    plan:
      makes_dilutions: true
      prints: true
      source_wells: {A11: 5, B11: 10, C11: 20}
      print_steps:
        - [A11, A2, 2, 5]
        - [B11, B2, 2, 5]
        - [C11, C2, 2, 5]
      transfers: 27
      total_drops: 6
      tips: [A1]
