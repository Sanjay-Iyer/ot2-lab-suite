# Expected final state of user-test SOP 5 (deck reconfiguration and full experiment). See
# sop_01_basic_dilution.yaml for the format. Starts from the SOP 5 configuration: the tip rack is in slot 8.
sop: 5
title: Deck reconfiguration and full experiment
difficulty: 5
start_config: configs/workflows/user_test_sops/ai_dye_demo_sop05_start.yaml
ignored: [materials.sample.label, materials.solvent.label]
runs:
  - name: run 1 (plate in slot 8, slot 4 empty, new tip every transfer from A2)
    settings:
      deck.plate.slot: 8
      deck.paper.slot: 5
      deck.tuberack.slot: 7
      materials.sample.vial: A2
      materials.solvent.vial: A1
      dilution.enabled: true
      dilution.factors: [3, 9, 27]
      dilution.plate_column: "11"
      dilution.start_row: A
      dilution.total_volume_ul: 180
      dilution.prepared_volume_ul: null
      mixing.reps: 2
      mixing.volume_ul: 15
      print.enabled: true
      print.droplet_volume_ul: 5
      print.droplets_per_spot: 2
      print.replicates: 2
      print.paper_start_column: 6
      tips.start_tip: A2
      tips.return_tips: false
      tips.policy: new_tip_every_transfer
    choices:
      deck.tiprack.slot: {one_of: [1, 2, 3, 6, 9, 10, 11]}   # any free slot except 4; OFF DECK is refused
    plan:
      makes_dilutions: true
      prints: true
      source_wells: {A11: 3, B11: 9, C11: 27}
      print_steps:
        - [A11, A6, 2, 5]
        - [A11, A7, 2, 5]
        - [B11, B6, 2, 5]
        - [B11, B7, 2, 5]
        - [C11, C6, 2, 5]
        - [C11, C7, 2, 5]
      transfers: 28
      total_drops: 12
      tips: [A2, B2, C2, D2, E2, F2, G2, H2, A3, B3, C3, D3, E3, F3, G3, H3, A4, B4, C4, D4, E4, F4, G4, H4,
             A5, B5, C5, D5, E5, F5, G5, H5, A6, B6]
