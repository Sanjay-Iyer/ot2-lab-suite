# v13 spacing sweep: 4 clovers at 4 different droplet spacings, same row, 27 mm
# apart (every 3rd well) so neighbours can't cross-contaminate the read.
#
# half_width_mm / half_height_mm are offsets FROM THE CENTER, so separation
# between opposing droplets is 2x that value:
#   sep_2mm  half 1.00 mm -> 2.0 mm apart
#   sep_3mm  half 1.50 mm -> 3.0 mm apart
#   sep_4mm  half 2.00 mm -> 4.0 mm apart
#   sep_5mm  half 2.50 mm -> 5.0 mm apart
destination:
  default_clover_geometry:
    half_width_mm: 2.0
    half_height_mm: 2.0

  clover_grid:
    enabled: false

  manual_clover_centers:
    - name: sep_2mm
      reference_well: B2
      geometry: {half_width_mm: 1.0, half_height_mm: 1.0}

    - name: sep_3mm
      reference_well: B5
      geometry: {half_width_mm: 1.5, half_height_mm: 1.5}

    - name: sep_4mm
      reference_well: B8
      geometry: {half_width_mm: 2.0, half_height_mm: 2.0}

    - name: sep_5mm
      reference_well: B11
      geometry: {half_width_mm: 2.5, half_height_mm: 2.5}

  paper_bounds:
    x_dimension_mm: 127.76
    y_dimension_mm: 85.48
    grid_inset_x_mm: 14.38
    grid_inset_y_mm: 11.24
    boundary_mode: grid
    edge_margin_mm: 4.5
