# v10c: BP quick print from a 20 mL vial with no configured delays.
#
# Sequence on the shared A-C x 1-3 paper grid:
#   1. Print one 5 uL BP drop at all nine locations.
#   2. Print ten ADDITIONAL 5 uL BP drops at A3.
# Result: A3 has 11 drops total; every other location has one.
# Total: 19 deposits, 95 uL BP.
protocol_version: 13            # internal builder ID for v10c
protocol_label: v10c
destination_config: configs/printing/complementary_v10_locations.yaml

run_modes: {dry_run: true, do_dilution: false, do_print: true}

deck:
  source:      {slot: 7, load_name: tuberack_3dprint_20ml_8vials_v2, namespace: custom_beta, version: 1}
  paper:       {slot: 5, load_name: paper_print_96_flat, namespace: custom_beta, version: 1}
  tiprack_p20: {slot: 9, load_name: opentrons_96_tiprack_20ul}

pipette: {name: p20_single_gen2, mount: left}

source:
  kind: 20 mL vial
  well: A2
  material: BP
  loaded_volume_ul: 5000.0
  minimum_remaining_ul: 100.0
  aspirate_height_mm: 4.0
  park_height_mm: 5.0

print:
  volume_ul: 5.0
  layer_mode: initial_plus_extra
  layers: {}                   # unused in this mode; retained for schema consistency
  initial_layers: 1
  extra_layers: {A3: 10}       # ten additional drops after the initial A3 drop
  rest_minutes: 0.0            # no layer delays
  z_mm: 4.0
  air_gap_ul: 1.5
  air_gap_height_mm: 5.0
  push_out_ul: 3.0
  blow_out: true
  post_dispense_delay_s: 0.0   # no per-drop delay

tips:
  return_tips: true
  p20: {print_tip: A1}

flow_rates: {p20: {aspirate: 3.0, dispense: 3.0}}
safety: {p20_max_volume_ul: 20.0, expected_source_slot: 7}
