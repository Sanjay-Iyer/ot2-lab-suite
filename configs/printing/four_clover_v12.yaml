# v12: four-droplet "clover" printing for coffee-ring overlap experiments.
#
# Prints groups of four droplets around a configurable center so their dried
# rings can overlap toward the middle. Geometry lives in the shared locations
# file below; this file owns the source, the liquid-handling parameters and the
# safety envelope.
#
# Initial sweep: 4 clovers x 4 droplets x 1 layer = 16 deposits, 80 uL BP.
#
# BUILD (dry run, generates + simulates):
#   python scripts/build_vial_dilution_print.py --config configs/printing/four_clover_v12.yaml
# PLOT the resolved layout before uploading anything:
#   python scripts/plot_four_clover_layout.py --config configs/printing/four_clover_v12.yaml
protocol_version: 15            # builder ID -> src/protocols/printing/12_four_clover_paper_print.py
protocol_label: v12
destination_config: configs/printing/four_clover_locations.yaml

# dry_run stays TRUE until the plotted layout has been inspected. Flip to false
# (or pass --set-dry-run false) only for the real print.
run_modes: {dry_run: true, do_dilution: false, do_print: true}

deck:
  source:      {slot: 7, load_name: tuberack_3dprint_20ml_8vials_v2, namespace: custom_beta, version: 1}
  paper:       {slot: 5, load_name: paper_print_96_flat, namespace: custom_beta, version: 1}
  tiprack_p20: {slot: 9, load_name: opentrons_96_tiprack_20ul}

pipette: {name: p20_single_gen2, mount: left}

source:
  kind: 20 mL vial
  well: A2                      # EDIT if the material sits in a different vial
  material: BP
  loaded_volume_ul: 5000.0      # keeps liquid above the 4 mm aspiration height
  minimum_remaining_ul: 100.0
  aspirate_height_mm: 4.0
  park_height_mm: 5.0           # tip parks this far above the source during rests

printing:
  droplet_volume_ul: 5.0        # LIQUID per droplet; 4 droplets per clover per layer
  pre_air_chase_ul: 0.0         # AIR aspirated BEFORE the liquid, ending up behind it
                                # so it chases the drop off the tip on dispense. 0.0
                                # keeps this config on the original path. See
                                # four_clover_air_chase_v12.yaml for the test of this.
                                # NOT the same as air_gap_ul below.
  dispense_height_mm: 4.0       # above the paper surface
                                # aspiration height is a property of the source
                                # labware: see source.aspirate_height_mm above
  air_gap_ul: 1.5               # aspirated AFTER the liquid; sits between liquid and
                                # tip opening and exits FIRST. Anti-drip in transit
                                # only -- it cannot help the droplet detach.
  air_gap_height_mm: 5.0
  push_out_ul: 3.0
  blow_out: true                # matches v10/v11. At API 2.15 blow_out leaves the
                                # plunger unprepared and prepare_to_aspirate() is
                                # unavailable, so a small extra slug can creep in on
                                # later droplets. If droplet size drifts upward
                                # across the run, set this false and lean on push_out.
  inter_drop_delay_s: 2.0       # dwell after each droplet
  inter_layer_delay_s: 0.0      # rest between layer passes of one clover
  inter_clover_delay_s: 0.0     # rest before starting the next clover
  layers: 1                     # global default; per-clover `layers:` overrides it

# clover_by_clover  -> D1 D2 D3 D4, then the next clover (default: the four
#                      droplets are one physical experiment and should be laid
#                      down together while the ink state is comparable).
# position_by_position -> every D1, then every D2, ... maximises drying time
#                      between droplets of the same clover.
order: {mode: clover_by_clover}

validation:
  mode: warn                    # warn | error -- governs the two distance checks
  min_intra_clover_distance_mm: 1.0
  min_inter_clover_distance_mm: 8.0
  droplet_radius_mm: 1.5        # ASSUMED wetted/ring radius; no measurement exists
                                # in this repo. Used only to inset the boundary
                                # check and to judge distances. Update after the
                                # first physical print.
  allow_duplicate_droplet_positions: false

tips:
  return_tips: true
  p20: {print_tip: A1}

flow_rates: {p20: {aspirate: 3.0, dispense: 3.0}}
safety: {p20_max_volume_ul: 20.0, expected_source_slot: 7}
