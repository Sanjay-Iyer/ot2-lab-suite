# v10a: BP from a 20 mL vial -> shared 3 x 3 paper grid.
#
# Columns encode BP layers; each of rows A/B/C is an identical replicate:
#   column 1 = 1 x 5 uL, column 2 = 3 x 5 uL, column 3 = 10 x 5 uL.
# Total: 9 locations, 42 deposits, 210 uL BP.
protocol_version: 10            # internal builder ID for the v10a variant
protocol_label: v10a
destination_config: configs/printing/complementary_v10_locations.yaml

run_modes: {dry_run: true, do_dilution: false, do_print: true}

deck:
  source:      {slot: 7, load_name: tuberack_3dprint_20ml_8vials_v2, namespace: custom_beta, version: 1}
  paper:       {slot: 5, load_name: paper_print_96_flat, namespace: custom_beta, version: 1}
  tiprack_p20: {slot: 9, load_name: opentrons_96_tiprack_20ul}

pipette: {name: p20_single_gen2, mount: left}

source:
  kind: 20 mL vial
  well: A2                     # EDIT if BP is in a different vial-rack location
  material: BP
  loaded_volume_ul: 5000.0      # keeps the liquid above the 4 mm aspiration height
  minimum_remaining_ul: 100.0
  aspirate_height_mm: 4.0
  park_height_mm: 5.0

print:
  volume_ul: 5.0
  layer_mode: by_column
  layers: {1: 1, 2: 3, 3: 10}  # EDITABLE BP layer count per shared column
  rest_minutes: 5.0
  z_mm: 4.0
  air_gap_ul: 1.5
  air_gap_height_mm: 5.0
  push_out_ul: 3.0
  blow_out: true
  post_dispense_delay_s: 2.0

tips:
  return_tips: true
  p20: {print_tip: A1}

flow_rates: {p20: {aspirate: 3.0, dispense: 3.0}}
safety: {p20_max_volume_ul: 20.0, expected_source_slot: 7}
