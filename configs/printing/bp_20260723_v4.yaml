# BP paper print QUICK TEST, protocol v4. OT-2 software 7.0.2 / Python API 2.15.
#
# The fastest real-hardware check of the printing rig: P20 only, NO dilution, NO
# plate, NO P300. One tip aspirates from a single vial and dabs a few spots onto the
# paper. Run this before the full v3 workflow to confirm the bench is wired right.
#
# Default source is WATER (vial A1) so a failed first run wastes no nanoparticles.
# To dab the real stock instead, point source.vial at A2 and source.material: bp.
#
# v4 is embedded verbatim (it does not go through the dilution normalizer), so this
# file IS the protocol CONFIG. Build (dry-run by default) + simulate under API 2.15:
#   python scripts/build_vial_dilution_print.py --config configs/printing/bp_20260723_v4.yaml

protocol_version: 4

run_modes:
  dry_run: true          # flip to false (or use the runner's --live) for real motion
  do_print: true

deck:
  tuberack:    {slot: 7, load_name: tuberack_3dprint_20ml_8vials_v2, namespace: custom_beta, version: 1}
  paper:       {slot: 5, load_name: corning_96_wellplate_360ul_custom, namespace: custom_beta, version: 1}
  tiprack_p20: {slot: 9, load_name: opentrons_96_tiprack_20ul}

pipette: {name: p20_single_gen2, mount: left}

# Where to draw from. Water A1 by default; switch to {vial: A2, material: bp} for stock.
source: {vial: A1, material: water, aspirate_height_mm: 4.0}

print:
  volume_ul: 5.0             # <= 20 (P20 capacity)
  paper_column: 1            # which paper column to dab
  rows: [A, B, C, D]         # one spot per row; shorten for an even quicker check
  z_mm: 1.0                  # tip height above the paper surface
  blow_out: true
  post_dispense_delay_s: 0.3
  tip: A1                    # single reused P20 tip (slot-9 rack)

flow_rates: {aspirate: 3.0, dispense: 3.0}

tips: {return_tips: false}

safety:
  expected_tuberack_load_name: tuberack_3dprint_20ml_8vials_v2
  expected_well_count: 8
  p20_max_volume_ul: 20.0
