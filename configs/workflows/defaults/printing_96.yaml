# OT-2 Printing Demo Configuration — 96-Well Variant (Standard Opentrons Plate)
# ──────────────────────────────────────────────────────────────────────────────
# RECOMMENDED first physical test protocol.
#
# Uses:
#   opentrons_96_wellplate_200ul_pcr_full_skirt
#   — standard Opentrons labware, no custom namespace needed.
#
# Safe with p300_multi_gen2 (8-channel pipette).
# Wells are column-based: A1 = column 1, A2 = column 2, etc.
# The 8-channel pipette aligns A1-H1 when addressing A1.
#
# First run:
#   Set debug.dry_position_check: true to verify tip positions without liquid.
# ──────────────────────────────────────────────────────────────────────────────

demo_mode: dilution_print  # water_print | dilution_print | dry_run

plate:
  slot: 2
  labware: opentrons_96_wellplate_200ul_pcr_full_skirt
  # namespace and version intentionally omitted — standard Opentrons labware
  # uses the built-in Opentrons namespace. Do NOT add namespace: custom_beta.

tiprack:
  slot: 1
  labware: opentrons_96_tiprack_300ul

pipette:
  name: p300_multi_gen2
  mount: right

# Safe Z offsets — conservative values for first physical test.
z_offsets:
  travel_clearance_mm: 15.0   # top offset for safe lateral travel
  aspirate_height_mm: 3.0     # bottom offset during aspiration
  dispense_height_mm: 5.0     # bottom offset during dispense

layout:
  # Column-based wells for 8-channel pipette compatibility.
  # A1 = entire column 1 (A1-H1), A2 = column 2, A3 = column 3, A4 = column 4.
  food_coloring_source_wells: ["A1", "A2"]
  water_source_wells: ["A3", "A4"]
  dilution_destination_wells: ["A5", "A6"]
  print_source_wells: ["A5", "A6"]

dilution:
  enabled: true
  steps:
    - destination_well: "A5"
      water_source_well: "A3"
      food_coloring_source_well: "A1"
      water_volume_ul: 90.0     # 90 + 10 = 100 µL total (50% of 200 µL max)
      stock_volume_ul: 10.0
      mix_volume_ul: 50.0
      mix_repetitions: 3
    - destination_well: "A6"
      water_source_well: "A4"
      food_coloring_source_well: "A2"
      water_volume_ul: 75.0     # 75 + 25 = 100 µL total (50% of 200 µL max)
      stock_volume_ul: 25.0
      mix_volume_ul: 50.0
      mix_repetitions: 3

printing:
  calibration_only: false
  paper_slot: 3
  droplet_volume_ul: 10.0
  dispense_height_mm: 5.0
  safe_z_mm: 20.0
  print_positions:
    - source_well: "A5"
      label: "dilution_1"
      x_mm: 5.0
      y_mm: 5.0
    - source_well: "A6"
      label: "dilution_2"
      x_mm: 10.0
      y_mm: 10.0

tip_strategy:
  mode: reuse_single_tip_for_demo
  loaded_tip_count: 8
  starting_tip: A1
  return_tip_at_end: true
  drop_tip_at_end: false
  reuse_for_water: true
  reuse_for_stock: true
  reuse_for_mixing: true
  reuse_for_printing: true
  allowed_modes:
    - new_tip_each_transfer
    - reuse_low_to_high
    - reuse_per_phase
    - reuse_single_tip_for_demo

debug:
  enabled: true
  verbose_protocol_comments: true
  dry_run_no_liquid: false
  move_only: false
  dry_position_check: true  # true = move to wells at safe top height, no liquid

camera:
  enabled: true
  capture_before: true
  capture_after: true
  capture_after_each_dilution_step: true
  capture_after_each_print_step: true
  robot_image_dir: /data/vision/printing_demo_96
  image_filename_prefix: printing_96

output:
  local_run_root: runs
  create_metadata: true
  create_image_manifest: true
