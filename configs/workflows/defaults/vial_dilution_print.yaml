# ══════════════════════════════════════════════════════════════════════════════
# Vial Dilution -> 8-Channel Paper Print Demo — configuration
# ══════════════════════════════════════════════════════════════════════════════
# This is the single source of truth for the demo. Edit it, then build a
# robot-ready protocol with the YAML embedded:
#
#   conda activate ai
#   python scripts/build_vial_dilution_print.py --config configs/workflows/defaults/vial_dilution_print.yaml
#
# The builder validates this file, embeds it into a generated copy of
# src/protocols/vial_dilution_print.py, and simulates it. See
# docs/vial_dilution_print_demo.md for the full knob reference.
#
# Every top-level block below (except `run_modes`) becomes the protocol's CONFIG
# dict. Defaults reproduce the verified demo. Anything marked HARDWARE is fixed by
# the physical setup — change with care.
# ══════════════════════════════════════════════════════════════════════════════

# ── Deck: which slot + labware sits where ────────────────────────────────────────
# SINGLE-NOZZLE RULE: the dilution uses ONE nozzle of the 8-channel head; the other
# 7 idle nozzles stick out ~63 mm in a line. Keep the vial rack, tip rack, and plate
# in the MIDDLE rows (4-5-6 / 7-8-9) — OUT of the front row (1-2-3) and back row
# (10-11-12) — or the idle nozzles fall outside robot bounds (PartialTipMovement
# error). Then set pipette.single_start so the idle nozzles point AWAY from the
# tall (60 mm) vial rack. Plate & paper are 96-well so the 8-channel head can address
# a whole column. Current layout: rack=7, plate=4, paper=5, tips=9.
deck:
  tuberack:
    slot: 7
    load_name: tuberack_3dprint_20ml_8vials_v2
    namespace: custom_beta
    version: 1
  plate:
    slot: 4
    load_name: corning_96_wellplate_360ul_custom
    namespace: custom_beta
    version: 1
  paper:
    # A flat sheet of paper on the deck. Modelled as a 96-well plate SOLELY for
    # coordinate anchoring — the OT-2 needs a labware object to compute X/Y/Z
    # dispense positions. No liquid is loaded into this "plate"; the robot uses
    # the column chosen by printing.paper_start_column as the spatial reference for
    # droplet placement. dispense_z_mm (in the printing block) controls the actual
    # tip height above the paper surface relative to the bottom of that reference well.
    slot: 5
    load_name: corning_96_wellplate_360ul_custom
    namespace: custom_beta
    version: 1
  tiprack:
    slot: 9
    load_name: opentrons_96_tiprack_300ul

# ── Pipette (HARDWARE: 8-channel p300 on the right mount — do not change) ─────────
pipette:
  name: p300_multi_gen2
  mount: right
  single_start: A1          # active nozzle in single-tip mode. The vial rack (slot 7)
                            # is the BACK-most of the single-nozzle labware, so A1 (the
                            # BACK nozzle) makes the 7 idle nozzles hang FORWARD over
                            # empty/short slots (4/1, 6) — never back across the 60 mm
                            # rack, and never off the deck. (H1 sim-passes here too but
                            # sweeps the bare idle nozzles back over the tall rack at
                            # slot 7 → real-hardware collision risk.)

# ── Liquid sources: which VIAL in the rack (slot 7) holds what ───────────────────
sources:
  water_vial: A1            # vial well holding water
  food_coloring_vial: A2    # dye stock: same row as water, second rack column
  vial_aspirate_height_mm: 2.0   # above vial bottom; absolute model Z = 5 + 2 = 7 mm (53 mm into 55 mm vial)

# ── Dilution series ──────────────────────────────────────────────────────────────
dilution:
  enabled: true
  destination_column: "9"   # plate column that holds the series (its A..H wells)
  total_volume_ul: 200.0    # volume per well (<= 360 well max, <= 300 tip max)

  # How the fold factors are chosen. The number of factors = number of wells used
  # (top A down). A column has 8 rows, so keep it <= 8.
  factors:
    mode: explicit          # explicit | geometric | linear | log
    # explicit : use this list verbatim (1 = undiluted stock)
    explicit: [1, 2, 5, 10, 20, 30, 40, 50]
    # geometric: factor[i] = start * step_factor**i  (e.g. step 2 -> 1,2,4,8,...)
    step_factor: 2
    # linear/log: evenly / log spaced from start..end over `count`
    start: 1
    end: 50
    count: 8

  mix_reps: 3
  mix_volume_ul: 120.0      # per mix cycle (<= total_volume_ul, <= 300)

  # Single-channel dilution tips are auto-allocated from these tiprack COLUMNS,
  # skipping the print block column.
  #
  # ⚠ ORDER MATTERS: tips are allocated sequentially starting from the first row
  # (A) of the first listed column. The very first tip allocated (A of the first
  # column) becomes the dedicated water-only pass tip; subsequent tips are used
  # one-per-well for the stock + mix pass. If you reorder this list the water tip
  # source column changes, which is safe but may affect tip usage symmetry.
  #
  # Need >= (1 + number_of_dilution_wells) tips across all listed columns.
  setup_tip: H12             # one setup tip only; active A1 nozzle picks an H-row tip
  single_tip_columns: [12]   # legacy fallback; setup_tip is the real setting

# ── Printing ─────────────────────────────────────────────────────────────────────
# A single-nozzle print of one plate column = one physical tip active at a time.
printing:
  enabled: true
  source_column: "9"        # plate column to print (defaults to the dilution column)
  droplet_volume_ul: 30.0
  num_replicates: 3         # 3 prints of 8 droplets each = 24 droplets total (lines 9mm apart)

  # Leftmost paper column the print starts on. 1 = far-left edge of the sheet, and
  # the print is INDEPENDENT of source_column (where the liquid is drawn from).
  # Override per run in the Opentrons App via the "Paper start column" parameter —
  # e.g. set 5 to resume past columns already printed on the same sheet. The
  # pre-flight gate aborts if start_column + num_replicates runs off the sheet.
  paper_start_column: 1

  # Height above the bottom of the paper-proxy well.
  # For corning_96_wellplate_360ul_custom the well bottom sits ~3.55 mm above the
  # deck surface, so dispense_z_mm=1.0 places the tip close to the actual paper
  # surface. Adjust if the paper reference labware
  # changes or if the paper is raised (e.g. on a mat).
  dispense_z_mm: 1.0

  # Anti-drip air gap (µL): air pulled in BELOW the droplet right after aspirating,
  # so it sits at the tip opening and holds the liquid in during the move to the
  # paper. Dispensed together with the droplet. 0 disables it. Raise if you still
  # see dripping; keep droplet_volume_ul + air_gap_ul <= 300 (pipette max).
  air_gap_ul: 5.0

  # Hold the tips at the print location after dispensing/blow-out so the droplet can
  # detach onto the paper before the robot moves away.
  post_dispense_delay_s: 0.5

  # Smooth XY travel to the paper. Too fast can shake liquid out; too slow leaves
  # the tips hanging longer. Set null to use Opentrons default movement speed.
  move_speed_mm_per_s: 50.0

  # X/Y/Z offset (mm) between successive replicate columns on the paper.
  # z: 0.0 is correct for a flat paper surface; set non-zero only if replicates
  # are stacked vertically (unusual).
  replicate_spacing_mm:
    x: 9.0
    y: 0.0
    z: 0.0

  print_block_column: 1     # full 8-tip pickup from tiprack column 1
  blow_out: true            # blow out at the print location after each dispense
  touch_tip: false          # keep false initially; enable only if paper contact is safe

# ── Tips: keep your requirement to RETURN tips (true) vs trash them (false) ───────
tips:
  return_tips: true

# ── Camera / CV capture timing ───────────────────────────────────────────────────
camera:
  enabled: true
  capture_before: true
  capture_after: true

  # ROW LETTERS ONLY — do NOT include the column number here.
  # The protocol appends destination_column at runtime (e.g. 'C' + '1' → 'C1').
  # This means changing destination_column in the dilution block automatically
  # shifts camera capture to the correct wells without editing this list.
  capture_mid_rows: ["C", "E", "H"]

  # Robot-side image storage (OT-2 Linux path — runtime only; simulation skips this).
  robot_image_dir: /data/vision/vial_dilution_print
  robot_api_url: "http://localhost:31950/camera/picture"
  capture_timeout_s: 5

# ── Flow rates (uL/s); null = Opentrons default ──────────────────────────────────
flow_rates:
  aspirate: 20.0
  dispense: 80.0
  mix: null                 # informational only — OT-2 API has no separate mix rate

# ── Computer-vision expectations (used HOST-side by verify_print_droplets.py) ─────
# Pass --expect equal to cv.expected_droplets when you run the CV check.
cv:
  expected_droplets: 8      # should equal the number of dilution wells
  min_circularity_ok: 0.6
  detection:
    threshold_method: otsu
    min_area: 250
    invert: true

# ── Safety / pre-flight expectations (geometry cross-check of the loaded rack) ────
safety:
  expected_tuberack_load_name: tuberack_3dprint_20ml_8vials_v2
  expected_well_count: 8
  expected_diameter_mm: 28.0
  expected_depth_mm: 55.0
  expected_row_spacing_mm: 34.0
  expected_col_spacing_mm: 31.0
  geometry_tolerance_mm: 0.5
  pipette_min_accurate_ul: 20.0

  # ── Dynamic-validation constants ──────────────────────────────────────────────
  # Used by build_vial_dilution_print.py and test_vial_print.py to derive physical
  # bounds without hardcoding them in script logic.
  expected_plate_well_count: 96    # pre-flight checks plate + paper well count
  tiprack_rows_per_column: 8       # standard 96-tip = 8; update if rack changes
  pipette_max_volume_ul: 300.0     # p300_multi_gen2 max aspiration volume

# ── Run modes (App Runtime Parameters; map to the protocol's DEFAULT_* flags) ─────
# NOT part of CONFIG — the builder writes these into the DEFAULT_* constants so a
# simulation/headless run uses them. In the Opentrons App you override per run.
run_modes:
  dry_run: false            # load + pre-flight + comments only, no liquid motion
  do_dilution: true
  do_print: true
