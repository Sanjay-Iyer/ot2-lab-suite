# OT-2 Printing Demo Configuration
# Controls both water_print and dilution_print modes

demo_mode: dilution_print  # water_print or dilution_print

plate:
  slot: 2
  labware: corning_96_wellplate_360ul_flat

tiprack:
  slot: 1
  labware: opentrons_96_tiprack_300ul

pipette:
  name: p300_single_gen2
  mount: right

layout:
  food_coloring_source_wells: ["A1", "A2", "A3", "A4", "A5", "A6"]
  water_source_wells: ["A7", "A8", "A9", "A10", "A11", "A12"]
  dilution_destination_wells: ["B7", "B8", "B9", "B10", "B11", "B12"]
  print_source_wells: ["B7", "B8", "B9", "B10", "B11", "B12"]

dilution:
  enabled: true
  steps:
    - destination_well: "B7"
      water_source_well: "A7"
      food_coloring_source_well: "A1"
      water_volume_ul: 180.0
      stock_volume_ul: 20.0
      mix_volume_ul: 100.0
      mix_repetitions: 3
    - destination_well: "B8"
      water_source_well: "A8"
      food_coloring_source_well: "A1"
      water_volume_ul: 150.0
      stock_volume_ul: 50.0
      mix_volume_ul: 100.0
      mix_repetitions: 3
    - destination_well: "B9"
      water_source_well: "A9"
      food_coloring_source_well: "A1"
      water_volume_ul: 100.0
      stock_volume_ul: 100.0
      mix_volume_ul: 100.0
      mix_repetitions: 3

printing:
  calibration_only: false
  paper_slot: 9
  droplet_volume_ul: 10.0
  dispense_height_mm: 1.0
  safe_z_mm: 20.0
  print_positions:
    - source_well: "B7"
      label: "dilution_1"
      x_mm: 5.0
      y_mm: 5.0
    - source_well: "B8"
      label: "dilution_2"
      x_mm: 10.0
      y_mm: 10.0
    - source_well: "B9"
      label: "dilution_3"
      x_mm: 15.0
      y_mm: 15.0

tip_strategy:
  mode: reuse_low_to_high  # reuse_low_to_high, new_tip_each_transfer, reuse_per_phase
  allowed_modes:
    - new_tip_each_transfer
    - reuse_low_to_high
    - reuse_per_phase

debug:
  enabled: true
  verbose_protocol_comments: true
  dry_run_no_liquid: true
  move_only: true

camera:
  enabled: false
  capture_before: true
  capture_after: true
  capture_after_each_dilution_step: true
  capture_after_each_print_step: true
  robot_image_dir: /data/vision/printing_demo
  image_filename_prefix: printing_demo

output:
  local_run_root: runs
  create_metadata: true
  create_image_manifest: true
