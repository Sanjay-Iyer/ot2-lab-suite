# Registered machine profile for standard paper printing on the OT-2.
#
# This file is laboratory-owned. It carries deck slots, labware identities,
# calibrated heights, and the physically validated droplet release behaviour.
# It contains no scientific meaning: no liquids, no dilutions, no layout.
#
# Experiment configurations reference this profile by path
# (`machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml`)
# instead of restating it. An agent proposing an experiment must never invent or
# alter these values; changing calibrated geometry is a laboratory decision that
# requires physical revalidation.
#
# Provenance of the release parameters:
#   configs/printing/four_clover_spacing_v13.yaml records
#   `dispense_height_mm: 0.5` as physically confirmed (previously 4.0), with a
#   1.5 uL trailing air gap, 3.0 uL push-out, and blow-out enabled.
# Provenance of the plate aspiration height:
#   0.2 mm is the laboratory-validated low-volume operating point for the
#   6.86 mm flat-bottom well geometry. Changes require physical revalidation.

profile_id: ot2_standard_printing_p20_v1

machine:
  robot_type: OT-2
  api_level: "2.15"

  pipette:
    name: p20_single_gen2
    mount: left
    minimum_volume_ul: 1.0
    maximum_volume_ul: 20.0
    flow_rates:
      aspirate_ul_s: 3.0
      dispense_ul_s: 3.0

  labware:
    - role: vial_rack
      kind: source
      load_name: tuberack_3dprint_20ml_8vials_v2
      namespace: custom_beta
      version: 1
      slot: 7
      well_diameter_mm: 28.0
      aspirate_reference: bottom
      aspirate_height_mm: 4.0
      dispense_reference: top
      dispense_height_mm: -2.0

    - role: plate
      kind: preparation
      load_name: corning_96_wellplate_360ul_custom
      namespace: custom_beta
      version: 1
      slot: 4
      well_diameter_mm: 6.86
      aspirate_reference: bottom
      aspirate_height_mm: 0.2
      dispense_reference: top
      dispense_height_mm: -2.0

    - role: paper
      kind: substrate
      load_name: paper_print_96_flat
      namespace: custom_beta
      version: 1
      slot: 5
      aspirate_reference: bottom
      aspirate_height_mm: 0.5
      dispense_reference: bottom
      dispense_height_mm: 0.5

    - role: tiprack
      kind: tiprack
      load_name: opentrons_96_tiprack_20ul
      namespace: opentrons
      version: 1
      slot: 9

  print_release:
    dispense_reference: bottom
    dispense_height_mm: 0.5
    pre_air_chase_ul: 0.0
    trailing_air_gap_ul: 1.5
    air_gap_height_mm: 5.0
    push_out_ul: 3.0
    blow_out: true
    post_dispense_delay_s: 2.0
