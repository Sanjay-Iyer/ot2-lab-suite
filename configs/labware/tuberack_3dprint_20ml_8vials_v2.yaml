# ──────────────────────────────────────────────────────────────────
# 8 × 20 mL vials in a custom 3D-printed tube rack — v2 (2 rows × 4 cols)
# ──────────────────────────────────────────────────────────────────
# Generates labware/tuberack_3dprint_20ml_8vials_v2.json.
#
#     python scripts/generate_labware.py configs/labware/tuberack_3dprint_20ml_8vials_v2.yaml
#
# v2 vs v1: the printed rack's OUTER footprint shrank from 127.76 × 85.48 mm
# to 127 × 85 mm (a "smaller rectangle"). The vial cavities are unchanged in
# size (Ø28, 55 mm deep, 20 mL) and column spacing (31 mm), but the two rows
# shifted 0.48 mm toward the front to stay centred in the smaller body
# (y = 59.74/25.74 → 59.26/25.26). Distinct loadName so it coexists with v1.
# ──────────────────────────────────────────────────────────────────

load_name: tuberack_3dprint_20ml_8vials_v2
display_name: TubeRack_3Dprint_20ml_8vials_v2
brand: custom
brand_ids: [custom]
namespace: custom_beta
version: 1
display_category: tubeRack
plate_format: irregular

# 2 rows (A-B) × 4 columns = 8 vials
rows: 2
cols: 4

# Vial centres (mm) from the rack's front-left corner.
# Columns at x = 17.38 / 48.38 / 79.38 / 110.38 ; rows A/B at y = 59.26 / 25.26.
x_offset: 17.38
y_offset: 59.26
x_spacing: 31.0
y_spacing: 34.0
well_z: null            # auto-computes to 60 - 55 = 5.0

# Vial geometry — flat-bottom, deep, 28 mm mouth.
shape: circular
diameter: 28.0
depth: 55.0
total_liquid_volume: 20000
well_bottom_shape: flat

# Footprint (SBS so it seats in an OT-2 deck slot); 60 mm overall height = vial top.
# v2 outer rectangle is slightly smaller than v1 (was 127.76 × 85.48).
x_dimension: 127.0
y_dimension: 85.0
z_dimension: 60.0
