schema_version: print-experiment-job/v1
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml
experiment:
  metadata:
    experiment_id: sers_experiment_001
    title: SERS Experiment on Paper
    description: SERS experiment with nanoparticle and crystal violet dilution series
      on paper.
    notes:
      summary: 'Eight-point twofold dilution series for both NP and CV. NP series
        in column 1, CV series in column 2. Printing 4 columns on paper. Column 1:
        NP series + CV stock. Column 2: NP series (3 layers) + CV stock. Column 3:
        CV stock control. Column 4: CV series control. Drying time 5 minutes between
        layers/steps. Resuspend before each droplet.'
  policies:
    require_drying_delay_between_deposits: true
  liquids:
  - liquid_id: np_stock
    display_name: plasmonic nanoparticle stock
    location:
      labware: vial_rack
      well: A1
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: np_diluent
    display_name: nanoparticle diluent
    location:
      labware: vial_rack
      well: A2
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: cv_stock
    display_name: crystal violet stock
    location:
      labware: vial_rack
      well: A3
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: cv_diluent
    display_name: crystal violet diluent
    location:
      labware: vial_rack
      well: A4
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  procedure:
  - id: np_series
    description: Prepare twofold nanoparticle dilution series.
    type: serial_dilution
    source_liquid_id: np_stock
    diluent_liquid_id: np_diluent
    destination_labware: plate
    destination_wells:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    fold: 2
    target_usable_volume_ul: 30.0
    mix:
      cycles: 3
      volume_ul: 3.0
    product_liquid_ids: null
  - id: cv_series
    description: Prepare twofold crystal violet dilution series.
    type: serial_dilution
    source_liquid_id: cv_stock
    diluent_liquid_id: cv_diluent
    destination_labware: plate
    destination_wells:
    - A2
    - B2
    - C2
    - D2
    - E2
    - F2
    - G2
    - H2
    fold: 2
    target_usable_volume_ul: 30.0
    mix:
      cycles: 3
      volume_ul: 3.0
    product_liquid_ids: null
  - id: print_np_col1
    description: Print NP series column 1.
    type: print
    source:
      kind: series
      preparation_id: np_series
    substrate: paper
    targets:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 300.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_target
    purpose: sample
  - id: print_cv_overlay_col1
    description: Print CV stock onto NP column 1.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 300.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_step
    purpose: sample
  - id: print_np_col2
    description: Print NP series column 2 (3 layers).
    type: print
    source:
      kind: series
      preparation_id: np_series
    substrate: paper
    targets:
    - A2
    - B2
    - C2
    - D2
    - E2
    - F2
    - G2
    - H2
    volume_ul: 5.0
    repeats: 3
    delay_after_pass_s: 300.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_target
    purpose: sample
  - id: print_cv_overlay_col2
    description: Print CV stock onto NP column 2.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A2
    - B2
    - C2
    - D2
    - E2
    - F2
    - G2
    - H2
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 300.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_step
    purpose: sample
  - id: print_cv_control_col3
    description: Print CV stock control column 3.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A3
    - B3
    - C3
    - D3
    - E3
    - F3
    - G3
    - H3
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_step
    purpose: control
  - id: print_cv_control_col4
    description: Print CV series control column 4.
    type: print
    source:
      kind: series
      preparation_id: cv_series
    substrate: paper
    targets:
    - A4
    - B4
    - C4
    - D4
    - E4
    - F4
    - G4
    - H4
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_target
    purpose: control
