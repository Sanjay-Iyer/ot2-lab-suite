# CURRENT WORKING CONFIG (seeded from the template) - GENERAL STANDARD PAPER PRINT
#
# Copy this, edit it, and run:
#   python scripts/run_printing_experiment_robot.py standard-print --config <your.yaml>
#
# Printing only. Make any dilution separately with the dilution workflow first.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml
protocol_label: standard_print

# DEFAULT IS LIVE. Real physical instrument test.
run_modes: {dry_run: false}

# --- where the liquid comes from ------------------------------------------------
# type: vial_rack     -> tuberack_3dprint_20ml_8vials_v2      (default slot 7)
# type: corning_plate -> corning_96_wellplate_360ul_custom    (default slot 4)
# type: well_plate    -> brand_96_wellplate_350ul_flat_781662 (default slot 1)
source:
  type: vial_rack
  slot: 7
  wells: [A1]               # print groups pick their source from this list
  material: print liquid
  loaded_volume_ul: 5000.0
  minimum_remaining_ul: 100.0
  aspirate_height_mm: 4.0   # 4.0 for the vial rack, ~0.5-1.0 for a plate well

# --- which paper to print on ----------------------------------------------------
substrate:
  slot: 11                  # slot 5 and slot 11 both hold paper

# --- printing behaviour ---------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0   # pause after each individual droplet
  inter_layer_delay_s: 5.0  # DRYING pause between stacked layers

# --- what to print ---------------------------------------------------------
# Execution is LAYER-MAJOR: every target that still owes a droplet gets one in
# layer 1, then the run waits inter_layer_delay_s, then layer 2, and so on.
# A group with droplets: 1 takes part in layer 1 only.
#
#   layer 1: A1 B1 C1 D1 E1 F1 G1 H1
#   (add a second group with droplets: 3 to stack three layers on those targets)
print_groups:
  - source_well: A1
    targets: [A1, B1, C1, D1, E1, F1, G1, H1]
    droplets: 1

# --- tips -----------------------------------------------------------------------
# true  -> one tip per distinct source well, held across all targets and layers
# false -> a fresh tip for every single deposit
tips:
  pipette_tip_reuse: true
  print_tip: A1
  return_tips: true
