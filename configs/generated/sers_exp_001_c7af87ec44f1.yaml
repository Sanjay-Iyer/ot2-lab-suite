schema_version: print-experiment-job/v1
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml
experiment:
  metadata:
    experiment_id: sers_exp_001
    title: SERS Experiment Series
    description: SERS experiment with nanoparticle and crystal violet dilution series.
    notes:
      summary: 'Eight-point twofold dilution series for both NP and CV. NP series:
        1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128. CV series: 1, 1/2, 1/4, 1/8, 1/16,
        1/32, 1/64, 1/128. Mixing: 3 times with 3 uL. Printing: 5 uL droplets. Column
        1: NP series (1 drop) + 5m dry + CV stock. Column 2: NP series (3 drops, 5m
        inter-layer) + 5m dry + CV stock. Column 3: CV stock (8 reps). Column 4: CV
        series (1 drop).'
  policies:
    require_drying_delay_between_deposits: true
  liquids:
  - liquid_id: np_stock
    display_name: nanoparticle_stock
    location:
      labware: vial_rack
      well: A1
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: np_diluent
    display_name: np_diluent
    location:
      labware: vial_rack
      well: A2
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: cv_stock
    display_name: crystal_violet_stock
    location:
      labware: vial_rack
      well: A3
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  - liquid_id: cv_diluent
    display_name: cv_diluent
    location:
      labware: vial_rack
      well: A4
    loaded_volume_ul: 5000.0
    minimum_remaining_ul: 2600.0
  procedure:
  - id: np_ladder
    description: Prepare NP dilution series.
    type: serial_dilution
    source_liquid_id: np_stock
    diluent_liquid_id: np_diluent
    destination_labware: plate
    destination_wells:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    fold: 2
    target_usable_volume_ul: 30.0
    mix:
      cycles: 3
      volume_ul: 3.0
    product_liquid_ids: null
  - id: cv_ladder
    description: Prepare CV dilution series.
    type: serial_dilution
    source_liquid_id: cv_stock
    diluent_liquid_id: cv_diluent
    destination_labware: plate
    destination_wells:
    - A4
    - B4
    - C4
    - D4
    - E4
    - F4
    - G4
    - H4
    fold: 2
    target_usable_volume_ul: 30.0
    mix:
      cycles: 3
      volume_ul: 3.0
    product_liquid_ids: null
  - id: print_np_col1
    description: Print NP series (1 drop) to column 1.
    type: print
    source:
      kind: series
      preparation_id: np_ladder
    substrate: paper
    targets:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_target
    purpose: sample
  - id: dry_col1
    description: Dry column 1.
    type: delay
    duration_s: 300.0
    reason: Dry column 1 before CV print.
  - id: print_cv_col1
    description: Print CV stock to column 1.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A1
    - B1
    - C1
    - D1
    - E1
    - F1
    - G1
    - H1
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate: null
    tip_policy: per_step
    purpose: sample
  - id: print_np_col2
    description: Print NP series (3 drops) to column 2.
    type: print
    source:
      kind: series
      preparation_id: np_ladder
    substrate: paper
    targets:
    - A2
    - B2
    - C2
    - D2
    - E2
    - F2
    - G2
    - H2
    volume_ul: 5.0
    repeats: 3
    delay_after_pass_s: 300.0
    mix_before_aspirate:
      cycles: 3
      volume_ul: 3.0
    tip_policy: per_target
    purpose: sample
  - id: dry_col2
    description: Dry column 2.
    type: delay
    duration_s: 300.0
    reason: Dry column 2 before CV print.
  - id: print_cv_col2
    description: Print CV stock to column 2.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A2
    - B2
    - C2
    - D2
    - E2
    - F2
    - G2
    - H2
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate: null
    tip_policy: per_step
    purpose: sample
  - id: print_cv_col3
    description: Print CV stock to column 3.
    type: print
    source:
      kind: liquid
      liquid_id: cv_stock
    substrate: paper
    targets:
    - A3
    - B3
    - C3
    - D3
    - E3
    - F3
    - G3
    - H3
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate: null
    tip_policy: per_step
    purpose: control
  - id: print_cv_col4
    description: Print CV series to column 4.
    type: print
    source:
      kind: series
      preparation_id: cv_ladder
    substrate: paper
    targets:
    - A4
    - B4
    - C4
    - D4
    - E4
    - F4
    - G4
    - H4
    volume_ul: 5.0
    repeats: 1
    delay_after_pass_s: 0.0
    mix_before_aspirate: null
    tip_policy: per_target
    purpose: control
