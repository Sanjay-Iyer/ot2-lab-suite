# =============================================================================
# 23 - PRINT THE EIGHT COLUMN-11 DILUTIONS ON SLOT-5 PAPER COLUMNS 3 AND 4
# =============================================================================
# Slot-5 mirror of script 21. Each dilution in BRAND plate column 11 (slot 1)
# is printed onto the matching row in BOTH columns 3 and 4 of paper in slot 5:
#
#   A11 -> A3, A4       E11 -> E3, E4
#   B11 -> B3, B4       F11 -> F3, F4
#   C11 -> C3, C4       G11 -> G3, G4
#   D11 -> D3, D4       H11 -> H3, H4
#
# Column 3 is an overprint on the eight A10 spots made by script 22. Column 4
# receives the same dilution series on separate paper spots.
#
# 16 deposits x 5 uL = 80 uL total, 10 uL drawn from each source well. There
# is no further dilution, stacking, or drying delay in this script.
#
# SIMULATION LAPTOP (build + local simulation only):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/23_column11_dilutions_to_paper5_columns3_4.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py column11-paper5-columns3-4 --robot-ip 169.254.46.57 --live
#
# Script 22 uses tip B5. This script starts at clean tip C5 and assigns one
# dedicated tip to each source: C5, D5, E5, F5, G5, H5, A6, and B6.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: column11_dilutions_to_paper5_columns3_4

# The generated protocol moves liquid. The named runner requires --live.
run_modes: {dry_run: false}

# --- sources: eight prepared dilutions in the BRAND plate, slot 1 ------------
source:
  type: well_plate
  slot: 1
  wells: [A11, B11, C11, D11, E11, F11, G11, H11]
  material: column-11 dilution series
  loaded_volume_ul: 100.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destination: paper in slot 5 --------------------------------------------
substrate:
  slot: 5

printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  inter_layer_delay_s: 0.0

print_groups:
  # Bind slot 5 explicitly to the intended row-specific plate source.
  - {source_well: A11, source_wells: {5: A11}, targets: [A3, A4], droplets: 1}
  - {source_well: B11, source_wells: {5: B11}, targets: [B3, B4], droplets: 1}
  - {source_well: C11, source_wells: {5: C11}, targets: [C3, C4], droplets: 1}
  - {source_well: D11, source_wells: {5: D11}, targets: [D3, D4], droplets: 1}
  - {source_well: E11, source_wells: {5: E11}, targets: [E3, E4], droplets: 1}
  - {source_well: F11, source_wells: {5: F11}, targets: [F3, F4], droplets: 1}
  - {source_well: G11, source_wells: {5: G11}, targets: [G3, G4], droplets: 1}
  - {source_well: H11, source_wells: {5: H11}, targets: [H3, H4], droplets: 1}

tips:
  pipette_tip_reuse: true
  print_tip: C5
  return_tips: true

