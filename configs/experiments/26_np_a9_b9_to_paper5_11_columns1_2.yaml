# 26 - NP from BRAND A9/B9 in slot 1 to paper columns 1/2 in slots 5 and 11
#
# User notation 9A/9B corresponds to Opentrons well names A9/B9.
# First print A9 onto A1-H1 on BOTH papers, then B9 onto A2-H2 on BOTH.
# Each target receives one 5 uL drop, matching the recent single-layer NP print.
# 32 deposits total: 80 uL from A9 and 80 uL from B9 (160 uL total).
# No dilution, overprint, extra layers, or inter-layer drying delay.
# Existing machine-profile print-release settings remain unchanged.
#
# SIMULATION LAPTOP (local build + simulation only; no robot contact):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/26_np_a9_b9_to_paper5_11_columns1_2.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py np-a9-b9-paper5-11 --live
# Script 27 prints the column-11 dye dilutions on top of these spots.
#
# loaded_volume_ul is a planning assumption PER source well, not a measurement.
# Load at least 100 uL per well (80 uL consumed + 20 uL reserve); update the
# configured 150 uL to match the actual starting volume before a physical run.
#
# Start at tip A1 for source A9; source B9 uses the next tip, B1.
# Both must be clean and unused. If rack history differs, update print_tip to
# the first of two clean consecutive tips before building. Tips are returned
# with NP residue; do not treat them as clean for a later run.
# Physical execution requires the real robot laptop and explicit readiness
# confirmation. Creating or locally simulating this config does not run it live.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml
protocol_label: np_a9_b9_to_paper5_11_columns1_2

# Liquid-handling protocol when executed; use only the local simulator here.
run_modes: {dry_run: false}

source:
  type: well_plate
  slot: 1
  wells: [A9, B9]
  material: nanoparticles
  loaded_volume_ul: 150.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

substrate:
  slots: [5, 11]

printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  inter_layer_delay_s: 0.0

print_groups:
  # Explicit per-paper bindings keep each column tied to its own NP source.
  - source_well: A9
    source_wells: {5: A9, 11: A9}
    targets: [A1, B1, C1, D1, E1, F1, G1, H1]
    droplets: 1
  - source_well: B9
    source_wells: {5: B9, 11: B9}
    targets: [A2, B2, C2, D2, E2, F2, G2, H2]
    droplets: 1

tips:
  pipette_tip_reuse: true
  print_tip: A1
  return_tips: true
