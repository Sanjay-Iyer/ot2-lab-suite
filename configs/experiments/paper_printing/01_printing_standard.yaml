# Experiment 01 - Standard SERS paper-printing experiment (human ground truth)
#
# This file is the CONFIG GROUND TRUTH for the paper. It was written by hand to
# encode exactly the same experiment as the frozen static reference
# src/protocols/printing/01_printing_standard_ground_truth.py, but it reaches the
# robot through the general architecture:
#
#   YAML -> PrintExperimentJobV1 -> validation -> ResolvedExperimentPlanV1
#        -> src/protocols/printing/01_printing_standard.py -> OT-2 simulation
#
# Nothing below describes robot motion. Deck slots, calibrated heights, and the
# validated droplet release profile all come from the referenced machine profile.

schema_version: print-experiment-job/v1

# Laboratory-owned hardware. Referenced, never restated or invented.
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

experiment:
  metadata:
    experiment_id: experiment_01_standard_printing
    title: Standard SERS paper printing - nanoparticle and crystal violet series
    description: >-
      Four printed columns on one 96-position paper substrate. Column 1 pairs an
      eight-point twofold nanoparticle series with stock crystal violet. Column 2
      repeats the nanoparticle deposition three times per position with five
      minutes between layers before the same stock crystal violet. Column 3 is a
      matched stock-crystal-violet-only control column. Column 4 is an eight-point
      twofold crystal violet dilution series with no nanoparticles.
    notes:
      concentration_units: >-
        Absolute crystal violet concentration is unknown, so all conditions are
        recorded as relative dilution factors, never molarity.
      drying_interval: >-
        The standardized drying interval between a nanoparticle deposit and the
        crystal violet deposit is the same five minutes required between repeated
        nanoparticle layers.

  policies:
    require_drying_delay_between_deposits: true

  # Liquids the operator physically loads before the run starts.
  liquids:
    - liquid_id: np_stock
      display_name: Plasmonic nanoparticle stock
      location: {labware: vial_rack, well: A1}
      loaded_volume_ul: 5000.0
      minimum_remaining_ul: 2600.0

    - liquid_id: np_diluent
      display_name: Nanoparticle diluent
      location: {labware: vial_rack, well: A2}
      loaded_volume_ul: 5000.0
      minimum_remaining_ul: 2600.0

    - liquid_id: cv_stock
      display_name: Crystal violet stock
      location: {labware: vial_rack, well: A3}
      loaded_volume_ul: 5000.0
      minimum_remaining_ul: 2600.0

    - liquid_id: cv_diluent
      display_name: Crystal violet diluent
      location: {labware: vial_rack, well: A4}
      loaded_volume_ul: 5000.0
      minimum_remaining_ul: 2600.0

  procedure:
    # ---------------------------------------------------------------- preparation
    - id: np
      type: serial_dilution
      description: >-
        Eight twofold nanoparticle conditions from stock through 1/128, each
        retaining 30 uL of usable volume for printing.
      source_liquid_id: np_stock
      diluent_liquid_id: np_diluent
      destination_labware: plate
      destination_wells: [A1, B1, C1, D1, E1, F1, G1, H1]
      fold: 2
      target_usable_volume_ul: 30.0
      mix: {cycles: 3, volume_ul: 3.0}
      # The first well holds an aliquot of the undiluted stock, so it keeps the
      # stock's own identity rather than gaining a second name.
      product_liquid_ids:
        [np_stock, np_1_2x, np_1_4x, np_1_8x, np_1_16x, np_1_32x, np_1_64x, np_1_128x]

    - id: cv
      type: serial_dilution
      description: >-
        Eight twofold crystal violet conditions from stock through 1/128 for the
        nanoparticle-free dilution column.
      source_liquid_id: cv_stock
      diluent_liquid_id: cv_diluent
      destination_labware: plate
      destination_wells: [A2, B2, C2, D2, E2, F2, G2, H2]
      fold: 2
      target_usable_volume_ul: 30.0
      mix: {cycles: 3, volume_ul: 3.0}
      product_liquid_ids:
        [cv_stock, cv_1_2x, cv_1_4x, cv_1_8x, cv_1_16x, cv_1_32x, cv_1_64x, cv_1_128x]

    # ------------------------------------------------- column 1: single NP deposit
    - id: column1_np
      type: print
      description: dry all column-1 nanoparticle deposits before stock CV
      source: {kind: series, preparation_id: np}
      substrate: paper
      targets: [A1, B1, C1, D1, E1, F1, G1, H1]
      volume_ul: 5.0
      repeats: 1
      delay_after_pass_s: 300.0
      mix_before_aspirate: {cycles: 3, volume_ul: 3.0}
      tip_policy: per_target
      purpose: sample

    - id: column1_cv
      type: print
      description: stock crystal violet over the single nanoparticle deposit
      source: {kind: liquid, liquid_id: cv_stock}
      substrate: paper
      targets: [A1, B1, C1, D1, E1, F1, G1, H1]
      volume_ul: 5.0
      repeats: 1
      tip_policy: per_step
      purpose: sample

    # --------------------------------------------- column 2: repeated NP deposits
    - id: column2_np
      type: print
      description: dry each column-2 nanoparticle layer before the next
      source: {kind: series, preparation_id: np}
      substrate: paper
      targets: [A2, B2, C2, D2, E2, F2, G2, H2]
      volume_ul: 5.0
      repeats: 3
      delay_after_pass_s: 300.0
      mix_before_aspirate: {cycles: 3, volume_ul: 3.0}
      tip_policy: per_target
      purpose: sample

    - id: column2_cv
      type: print
      description: stock crystal violet over the three nanoparticle layers
      source: {kind: liquid, liquid_id: cv_stock}
      substrate: paper
      targets: [A2, B2, C2, D2, E2, F2, G2, H2]
      volume_ul: 5.0
      repeats: 1
      tip_policy: per_step
      purpose: sample

    # ------------------------------------------- column 3: matched CV-only control
    - id: column3_cv_control
      type: print
      description: >-
        Eight replicate paper-plus-stock-crystal-violet controls at the same
        volume and concentration as the nanoparticle conditions.
      source: {kind: liquid, liquid_id: cv_stock}
      substrate: paper
      targets: [A3, B3, C3, D3, E3, F3, G3, H3]
      volume_ul: 5.0
      repeats: 1
      tip_policy: per_step
      purpose: control

    # ------------------------------------------------ column 4: CV dilution series
    - id: column4_cv
      type: print
      description: >-
        Nanoparticle-free crystal violet dilution series, reported as relative
        dilution factors.
      source: {kind: series, preparation_id: cv}
      substrate: paper
      targets: [A4, B4, C4, D4, E4, F4, G4, H4]
      volume_ul: 5.0
      repeats: 1
      mix_before_aspirate: {cycles: 3, volume_ul: 3.0}
      tip_policy: per_target
      purpose: control
