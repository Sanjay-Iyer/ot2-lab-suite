# =============================================================================
# 27 - OVERPRINT THE COLUMN-11 DYE DILUTIONS ONTO THE SCRIPT-26 NP SPOTS
# =============================================================================
# Companion to script 26. Script 26 lays down the nanoparticles:
#   BRAND A9 (user notation 9A) -> paper column 1, rows A-H
#   BRAND B9 (user notation 9B) -> paper column 2, rows A-H
# on BOTH papers (slot 5 and slot 11). This script prints the eight-step dye
# dilution series held in BRAND plate column 11 (slot 1) on top of those spots,
# one dilution per row, so every dilution meets both nanoparticle types:
#
#   A11 -> A1, A2      E11 -> E1, E2
#   B11 -> B1, B2      F11 -> F1, F2
#   C11 -> C1, C2      G11 -> G1, G2
#   D11 -> D1, D2      H11 -> H1, H2
#
# ...and the same 16-spot pattern is repeated on the second paper. 32 deposits
# x 5 uL = 160 uL total, 20 uL drawn from each of the eight dilution wells.
# No further dilution, no extra layers, no drying delay in this script.
#
# ORDER MATTERS: run script 26 first and let the NP spots dry before running
# this one. Running this script alone prints dye onto bare paper.
#
# SIMULATION LAPTOP (local build + simulation only; no robot contact):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/27_dye_column11_over_np_paper5_11_columns1_2.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py np-a9-b9-paper5-11 --live
#   ...let the nanoparticle spots dry, then:
#   python scripts/run_printing_experiment_robot.py dye-column11-over-np-paper5-11 --live
#
# loaded_volume_ul is a planning assumption PER dilution well, not a
# measurement. Column 11 was already drawn from by scripts 23-25, so top the
# series back up to at least 40 uL per well (20 uL consumed + 20 uL reserve)
# or correct the configured 100 uL to the actual starting volume before running.
#
# TIPS: one shared tip for the whole dye pass, by request. The run starts at
# B1 and keeps that single tip on the pipette for all 32 deposits across all
# eight dilutions.
#
# CHECK BEFORE RUNNING: B1 is near the start of the rack. Scripts up through 26
# consume tips as far as D7, so B1 is only clean on a FRESH or replaced
# tiprack in slot 9. If the rack from scripts 23-26 is still loaded, B1 is
# already used -- put in a new rack or move print_tip to the first clean tip.
#
# Consequence to be aware of: the tip carries dye between dilution wells. Going
# A11 -> H11 in the order below, each aspiration returns a tip wetted with the
# previous (more concentrated) dilution to the next well, so carryover runs
# from concentrated toward dilute and contaminates the stock wells themselves.
# The one-tip-per-source default that scripts 23-26 use exists to prevent this.
# To cut carryover without giving up the single tip, reverse the print_groups
# order so the most dilute well is drawn first; the row/column layout is bound
# per group and does not change.
#
# The tip is returned to the rack with dye residue; do not treat B1 as clean
# for any later run.
# Physical execution requires the real robot laptop and explicit readiness
# confirmation. Creating or locally simulating this config does not run it live.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: dye_column11_over_np_paper5_11_columns1_2

# The generated protocol moves liquid. The named runner requires --live.
run_modes: {dry_run: false}

# --- sources: the eight prepared dye dilutions in the BRAND plate, slot 1 ----
source:
  type: well_plate
  slot: 1
  wells: [A11, B11, C11, D11, E11, F11, G11, H11]
  material: column-11 dye dilution series
  loaded_volume_ul: 100.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destinations: both papers, slot 5 and slot 11 --------------------------
substrate:
  slots: [5, 11]

printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  inter_layer_delay_s: 0.0

print_groups:
  # Explicit per-paper bindings keep each row tied to its own dilution well on
  # both papers, exactly as script 26 binds each column to its own NP well.
  - {source_well: A11, source_wells: {5: A11, 11: A11}, targets: [A1, A2], droplets: 1}
  - {source_well: B11, source_wells: {5: B11, 11: B11}, targets: [B1, B2], droplets: 1}
  - {source_well: C11, source_wells: {5: C11, 11: C11}, targets: [C1, C2], droplets: 1}
  - {source_well: D11, source_wells: {5: D11, 11: D11}, targets: [D1, D2], droplets: 1}
  - {source_well: E11, source_wells: {5: E11, 11: E11}, targets: [E1, E2], droplets: 1}
  - {source_well: F11, source_wells: {5: F11, 11: F11}, targets: [F1, F2], droplets: 1}
  - {source_well: G11, source_wells: {5: G11, 11: G11}, targets: [G1, G2], droplets: 1}
  - {source_well: H11, source_wells: {5: H11, 11: H11}, targets: [H1, H2], droplets: 1}

tips:
  pipette_tip_reuse: true
  # Requested: one tip for every dye deposition rather than one tip per
  # dilution well. Requires pipette_tip_reuse: true. See the TIPS note above
  # for the carryover this accepts.
  single_tip_all_sources: true
  print_tip: B1
  return_tips: true
