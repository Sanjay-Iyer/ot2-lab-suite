# =============================================================================
# 30 - PRINT HEIGHT SWEEP: A11 (BRAND plate, slot 1) -> PAPER SLOT 5, COLUMN 12
# =============================================================================
# One 5 uL drop on every row of paper column 12, each row dispensed from a
# DIFFERENT height above the paper. This is a calibration ladder: print one
# column, look at the eight spots, and pick the standoff that gives the best
# droplet release and spot shape.
#
#   row   target   dispense height above paper
#   A       A12       0.8 mm
#   B       B12       0.9 mm
#   C       C12       1.0 mm
#   D       D12       1.1 mm   <- the current profile height, the control
#   E       E12       1.2 mm
#   F       F12       1.3 mm
#   G       G12       1.4 mm
#   H       H12       1.5 mm
#
# 8 deposits x 5 uL = 40 uL, all from A11. One tip (A1), one source well, one
# layer, no pause, no overprint.
#
# ---------------------------------------------------------------------------
# THE LADDER: start 0.8 mm, +0.1 mm per row, 8 rows -> the last row is 1.5 mm.
# The request said 1.6 mm for the last row, but 0.8 -> 1.6 in 0.1 mm steps is
# NINE positions and column 12 has eight rows; 0.8 mm start and 0.1 mm step
# were kept, confirmed with the user. To end at 1.6 instead, either start at
# 0.9 (shift every value below up by 0.1) or use a 0.1143 mm step.
#
# WHY EIGHT GROUPS: dispense_height_mm is a PER-GROUP setting, so one row per
# group is the only way to give each row its own height. Groups all ask for 1
# droplet, so this is a single layer and they run top to bottom, A12 -> H12.
#
# WHAT IS BEING VARIED, AND WHAT IS NOT: only the Z standoff changes. Droplet
# volume (5 uL), the print-release air handling (0 uL pre-air chase, 1.5 uL
# trailing air gap taken at 5 mm, 3.0 uL push-out, blow-out on), aspiration
# height and flow rates are identical for all eight rows, so any difference
# between the spots is the height and nothing else.
#
# CONTEXT: the profile standoff is 1.1 mm (configs/machines/
# ot2_standard_printing_p20_v1.yaml -> print_release.dispense_height_mm),
# revised from a physically confirmed 0.5 mm on 2026-08-31 and still awaiting
# physical revalidation. This sweep is that revalidation: row D is the current
# value, with three rows below it and four above.
#
# TIP: A1, one tip for the whole run -- a single source well means a single
# tip. It must be clean and unused. If A1 already carries residue, move
# print_tip to the first clean tip.
#
# SOURCE VOLUME: A11 gives up 40 uL and holds 20 uL back, so it needs at least
# 60 uL at the start. loaded_volume_ul below is a planning assumption, not a
# measurement -- correct it to the real level before a physical run.
#
# DECK (from the machine profile; nothing here may move it):
#   slot 1  BRAND 781662 96-well plate   source, well A11
#   slot 5  paper sheet                  the only substrate
#   slot 9  opentrons_96_tiprack_20ul    tip A1
#
# RUN TIME: about 3 minutes. No delays anywhere in this run.
#
# SIMULATION LAPTOP (local build + simulation only; no robot contact):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/30_a11_paper5_column12_height_sweep.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py a11-paper5-column12-height-sweep --live
#
# Physical execution requires the real robot laptop and explicit readiness
# confirmation. Creating or locally simulating this config does not run it live.
# =============================================================================

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: a11_paper5_column12_height_sweep

# The generated protocol moves liquid. The named runner requires --live.
run_modes: {dry_run: false}

# --- source: A11 in the BRAND 781662 plate, slot 1 -----------------------------
source:
  type: well_plate
  slot: 1
  wells: [A11]
  material: A11 print liquid
  # 40 uL drawn + 20 uL reserve = 60 uL minimum. 150 leaves 110 uL in the well,
  # about 2.9 mm deep in a 6.94 mm bore, well above the 0.5 mm aspiration
  # height for the last pull.
  loaded_volume_ul: 150.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destination: one paper sheet, slot 5 --------------------------------------
substrate:
  slot: 5

# --- printing behaviour ---------------------------------------------------------
# dispense_height is NOT set here: each group below carries its own. Everything
# else in the print-release comes from the machine profile and is identical for
# all eight rows.
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0     # no pause between droplets
  inter_layer_delay_s: 0.0    # unused: one droplet per group means one layer
  initial_delay_s: 0.0        # no hold before the first drop

# --- the ladder: one group per row, one height per group ------------------------
# Every group is 1 droplet from A11, so all eight run in a single layer, in
# list order, A12 down to H12. Only dispense_height_mm differs between them.
# source_wells: {5: A11} is the explicit per-slot binding the loader needs;
# a bare source_well is overridden by the config-level default.
print_groups:
  - {source_well: A11, source_wells: {5: A11}, targets: [A12], droplets: 1, dispense_height_mm: 0.8}
  - {source_well: A11, source_wells: {5: A11}, targets: [B12], droplets: 1, dispense_height_mm: 0.9}
  - {source_well: A11, source_wells: {5: A11}, targets: [C12], droplets: 1, dispense_height_mm: 1.0}
  - {source_well: A11, source_wells: {5: A11}, targets: [D12], droplets: 1, dispense_height_mm: 1.1}
  - {source_well: A11, source_wells: {5: A11}, targets: [E12], droplets: 1, dispense_height_mm: 1.2}
  - {source_well: A11, source_wells: {5: A11}, targets: [F12], droplets: 1, dispense_height_mm: 1.3}
  - {source_well: A11, source_wells: {5: A11}, targets: [G12], droplets: 1, dispense_height_mm: 1.4}
  - {source_well: A11, source_wells: {5: A11}, targets: [H12], droplets: 1, dispense_height_mm: 1.5}

# --- tip behaviour -------------------------------------------------------------
# One source well, so one tip for the whole run. It is never dropped between
# rows, which is part of the point: the same tip prints all eight heights.
tips:
  pipette_tip_reuse: true
  print_tip: A1
  return_tips: true
