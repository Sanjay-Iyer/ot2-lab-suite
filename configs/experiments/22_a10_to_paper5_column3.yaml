# =============================================================================
# 22 - PRINT BRAND A10 ONTO ALL EIGHT SPOTS IN SLOT-5 PAPER COLUMN 3
# =============================================================================
# Slot-5 mirror of script 20. One 5 uL deposit is drawn from BRAND plate well
# A10 in slot 1 and printed onto every row of column 3 on paper in slot 5:
#
#   A10 -> A3, B3, C3, D3, E3, F3, G3, H3
#
# 8 deposits x 5 uL = 40 uL total. There is no dilution, stacking, or drying
# delay in this script.
#
# SIMULATION LAPTOP (build + local simulation only):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/22_a10_to_paper5_column3.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py a10-paper5-column3 --robot-ip 169.254.46.57 --live
#
# This pair assumes scripts 20 and 21 were run first with the same tip rack.
# Their last assigned tip is A5, so this script starts at clean tip B5. If the
# rack history differs, change tips.print_tip before building.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: a10_to_paper5_column3

# The generated protocol moves liquid. The named runner requires --live.
run_modes: {dry_run: false}

# --- source: selected well in the BRAND plate, slot 1 -------------------------
source:
  type: well_plate
  slot: 1
  wells: [A10]
  material: sample in A10
  loaded_volume_ul: 150.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destination: paper in slot 5 --------------------------------------------
substrate:
  slot: 5

printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  inter_layer_delay_s: 0.0

print_groups:
  - source_well: A10
    targets: [A3, B3, C3, D3, E3, F3, G3, H3]
    droplets: 1

tips:
  pipette_tip_reuse: true
  print_tip: B5
  return_tips: true

