# =============================================================================
# 14 - DYE, TOP THREE ROWS OF COLUMNS 1 AND 2: BRAND B11 -> slots 5 and 11
# =============================================================================
# One 5 uL dye drop on the top three rows of each of the first two columns, on
# BOTH paper sheets:
#
#   column 1   A1 B1 C1     top three rows only
#   column 2   A2 B2 C2     top three rows only
#
# This overprints the other two runs:
#   * run 13 puts nanoparticles (A10) on all of column 1 -- dye covers only the
#     top three, so D1-H1 stay nanoparticles alone
#   * run 15 puts B10 stock on A2/B2/C2 -- dye covers all three
# Rows D2-H2 stay blank; nothing in this set of runs touches them.
#
# Execution is layer-major, and within the single layer it is target-then-paper,
# so each position is deposited on slot 5 and then slot 11 before advancing.
# Column 1 runs first, top to bottom, then column 2.
#
# 6 targets x 2 sheets x 1 drop x 5 uL = 12 deposits, 60 uL total
#                                        (30 uL per paper sheet)
#
# Single layer, so no inter-layer drying delay ever fires.
#
#   python scripts/run_printing_experiment_robot.py dye-column1-top3
#
# ---------------------------------------------------------------------------
# RUN THIS AFTER 13 AND 15, NOT BEFORE. Every position it prints has already
# been printed by one of those runs; let those drops dry first or the two
# liquids will pool together.
#
# TIP: this run starts at B1, not A1. Run 13 uses A1 and RETURNS it to the rack
# with nanoparticle residue -- starting here at A1 would carry that residue into
# the dye. Run 15 uses C1. Leave print_tip at B1.
# ---------------------------------------------------------------------------

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: dye_b11_col1_col2_rows_a_c

# DEFAULT IS LIVE. Real physical instrument test.
run_modes: {dry_run: false}

# --- source: the 5x diluted dye in the BRAND 781662 plate, slot 1 --------------
source:
  type: well_plate
  slot: 1
  wells: [B11]                # <- the 5x diluted dye
  material: dye (5x)
  # The run draws 60 uL and holds 20 uL back, so B11 must contain at least
  # 80 uL at start. Raise this to match what is actually left in B11.
  loaded_volume_ul: 100.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5     # low: the well has already been drawn down

# --- destinations: matching paper sheets in slots 5 and 11 ---------------------
substrate:
  slots: [5, 11]

# --- printing behaviour --------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0     # no pause between individual droplets
  inter_layer_delay_s: 0.0    # unused: there is only one layer

# --- what to print -------------------------------------------------------------
# Two groups, both in the same single layer. Groups run in the order listed, so
# column 1 is deposited before column 2 begins.
print_groups:
  - source_well: B11
    targets: [A1, B1, C1]     # column 1, top three rows
    droplets: 1

  - source_well: B11
    targets: [A2, B2, C2]     # column 2, top three rows
    droplets: 1

# --- tip behaviour -------------------------------------------------------------
# One source well, so a single tip is held for both sheets, both columns and the
# whole run. B1 -- see the tip note in the header before changing this.
tips:
  pipette_tip_reuse: true
  print_tip: B1
  return_tips: true
