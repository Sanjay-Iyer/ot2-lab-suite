# =============================================================================
# 16 - NANOPARTICLE COLUMN 1, RESUME AT LAYER 2: BRAND A10 -> slots 5 and 11
# =============================================================================
# Original layer 1 (run 13: one 5 uL drop on all eight rows of column 1) has
# ALREADY been printed. This workflow picks up at layer 2 and finishes the
# build-up. Layer numbers in the run log are offset so they read 2, 3, 4 ...
# matching the real experiment rather than restarting at 1.
#
# Remaining drops, per paper sheet. Only rows 5 and 6 are built up; every other
# position keeps the single drop it already has:
#
#   E2 (row 5)   +3 drops    layers 2, 3 and 4
#   F2 (row 6)   +9 drops    layers 2 through 10
#
# FINAL drop count per position once this run finishes:
#
#   A1 B1 C1      1 drop     (plus the B11 dye from run 14)
#   column 1      untouched by this run entirely
#   E2            4 drops
#   F2           10 drops
#
# 3 + 9 = 12 deposits per sheet, x 2 sheets = 24 deposits
# 24 x 5 uL = 120 uL total, 60 uL per paper sheet.
#
# THEN, in the same protocol: a two-hour hold, then one CV dye drop from C11 on
# E2 and F2 of both sheets (4 deposits, 20 uL). See the `overprint:` block.
# Whole thing is ONE run -- start it and disconnect.
#
# Execution is layer-major: every position still owing a drop receives one,
# then the whole pass rests for inter_layer_delay_s so the deposit can dry.
# E2 drops out after layer 4; F2 continues alone from layer 5 to layer 10.
#
#   python scripts/run_printing_experiment_robot.py nanoparticle-column1-layer2
#
# ---------------------------------------------------------------------------
# RUN TIME: 9 layers means 8 inter-layer waits of 1.5 hours each, plus the
# two-hour overprint hold -- about 14.5 hours end to end, as one single run. There is NO trailing delay after layer 10, and no initial
# hold: this assumes original layer 1 is already dry. To change either:
#   * continuous, no drying (~20 min): set inter_layer_delay_s to 0
#   * hold before layer 2 as well:     set initial_delay_s to 5400
#
# During every wait the tip is parked 50 mm above the top of source well A10 --
# high and clear of both papers and the plate, with no motion until the next
# layer begins. Adjust with source.park_height_mm.
#
# SOURCE VOLUME: this draws 120 uL from A10 and holds 20 uL back, so A10 needs
# at least 140 uL at the start. Run 13 already took 80 uL out of A10, so check
# the level and top it up if needed.
#
# TIP: D1 -- the next clean tip. A1 is the tip run 13 used for these same
# nanoparticles and returned to the rack; a fresh tip avoids dried residue
# narrowing the orifice over a run this long. Switch to A1 only if you would
# rather conserve tips and A1 is visibly clear.
# ---------------------------------------------------------------------------

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: nanoparticle_column1_layer2_resume

# DEFAULT IS LIVE. Real physical instrument test.
run_modes: {dry_run: false}

# --- source: nanoparticle suspension in the BRAND 781662 plate, slot 1 ---------
source:
  type: well_plate
  slot: 1
  # A10 = nanoparticles for the layers, C11 = CV dye for the finishing pass.
  # Each well gets its own tip automatically (one tip per source well).
  wells: [A10, C11]
  material: nanoparticles (A10) + CV dye (C11)
  # Applies to BOTH wells. A10 needs 120 uL drawn + 20 reserve = 140 uL;
  # C11 needs 20 uL drawn + 20 reserve = 40 uL. 200 clears both -- set it to
  # the SMALLER of the two real levels so the check stays honest.
  loaded_volume_ul: 200.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5     # low: the well drains over 24 pulls, and this
                              # stays near settled nanoparticles
  # Where the tip waits out each 1.5 hour dry: 50 mm above the TOP of A10, well
  # clear of the plate and both paper sheets. The arm holds there without motion
  # for the whole delay. Default is 5.0 mm; this is deliberately high.
  park_height_mm: 50.0

# --- destinations: matching paper sheets in slots 5 and 11 ---------------------
substrate:
  slots: [5, 11]

# --- printing behaviour --------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0     # no pause between individual droplets
  inter_layer_delay_s: 5400.0 # 1.5 HOURS of drying between drops on a position
  initial_delay_s: 0.0        # no hold up front: original layer 1 is already dry
  layer_number_offset: 1      # report layers as 2..10, not 1..9

# --- what to print -------------------------------------------------------------
# A group takes part in layer N only while its `droplets` count is >= N, which
# is what makes E2 stop after three passes while F2 continues to nine.
print_groups:
  - source_well: A10
    targets: [E2]             # row 5: 3 more drops
    droplets: 3

  - source_well: A10
    targets: [F2]             # row 6: 9 more drops
    droplets: 9

# --- finishing pass: CV dye, after everything has dried -------------------------
# Runs once every layer above is complete: the layer tip is dropped, the robot
# holds for delay_s with nothing attached, then a SECOND tip is picked up for
# C11 and one dye drop goes onto each target, on both papers.
# 2 targets x 2 sheets x 1 drop x 5 uL = 4 deposits, 20 uL.
overprint:
  delay_s: 7200             # TWO HOURS after the last nanoparticle drop
  source_well: C11          # CV dye -- gets its own tip, never the A10 tip
  targets: [E2, F2]
  droplets: 1

# --- tip behaviour -------------------------------------------------------------
# One source well, so a single tip is held for both sheets and the entire run,
# including through all eight 1.5 hour waits.
tips:
  pipette_tip_reuse: true
  print_tip: D1
  return_tips: true
