# =============================================================================
# 09 - ADD DYE: vial rack A2 (slot 7) -> BRAND plate A11 (slot 1)
# =============================================================================
# A straight top-up of the concentrated dye stock. No water, no dilution, no
# printing -- it just moves dye into A11 so the 5x dilutions have stock to draw
# from.
#
#   python scripts/run_printing_experiment_robot.py add-dye
#
# ---------------------------------------------------------------------------
# Moves 100 uL as 7 pulls: six of 15 uL then a final 10 uL. This ADDS to whatever
# A11 already holds and the robot cannot see the current level; the BRAND well
# caps at 350 uL, so A11 must be at 250 uL or less before you run this.
#
# A2 must hold at least ~410 uL: ~310 uL to keep the tip submerged at the 0.5 mm
# aspirate height, plus the 100 uL being removed.
# ---------------------------------------------------------------------------

# DEFAULT IS LIVE. Real physical instrument test.
run_modes: {dry_run: false}
protocol_label: add_dye


# One tip per distinct source well. Only the dye is moved, so this is 1 tip.
pipette_tip_reuse: true

# --- the dye being moved (treated as the "stock") -------------------------------
source:
  labware: tuberack_3dprint_20ml_8vials_v2
  slot: 7
  well: A2                    # <- the vial holding concentrated dye
  material: concentrated dye
  # 0.5 mm, not the usual 4.0 mm: this vial holds only a small amount of dye.
  # The vial is 28 mm across, so 4.0 mm would need ~2.5 mL just to submerge the
  # tip; at 0.5 mm it needs ~310 uL. Do not go lower -- below 0.5 mm a tip-length
  # or calibration error could drive the tip into the vial floor.
  aspirate_height_mm: 0.5

# --- no diluent is used ---------------------------------------------------------
# A diluent well must still be named (the workflow always resolves one), but
# diluent_volume_ul is 0 below so nothing is drawn from it and no tip touches it.
diluent:
  labware: tuberack_3dprint_20ml_8vials_v2
  slot: 7
  well: A1
  material: water (unused, 0 uL)
  aspirate_height_mm: 4.0

# --- destination: the dye stock well on the BRAND plate -------------------------
destination:
  labware: brand_96_wellplate_350ul_flat_781662
  slot: 1
  wells: [A11]
  aspirate_height_mm: 0.5
  dispense_height_mm: 2.0

# --- how much to move -----------------------------------------------------------
dilution:
  mode: single
  stock_volume_ul: 100        # 6 pulls x 15 uL + a final 10 uL = 7 pulls
  diluent_volume_ul: 0        # no water: this is a pure transfer
  transfer_chunk_ul: 15       # 15 uL per pull. Each pull takes min(chunk,
                              # remaining), so 100 uL becomes 15x6 then 10 --
                              # 7 pulls, the last one short.
                              # (15 + 1.5 uL air gap = 16.5 uL, well under the
                              #  20 uL P20 ceiling)
  mix_cycles: 0               # nothing to mix -- dye into dye
  mix_volume_ul: 15

# --- air handling ---------------------------------------------------------------
liquid_handling:
  air_gap_ul: 1.5
  air_gap_height_mm: 5.0

# --- tips -----------------------------------------------------------------------
tips:
  start_tip: A1
  return_tips: true
