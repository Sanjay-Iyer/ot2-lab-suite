# =============================================================================
# 25 - PRINT THE EIGHT COLUMN-11 DILUTIONS ONLY ON SLOT-5 PAPER COLUMN 3
# =============================================================================
# Second half of the split alternative to script 23. Each dilution in BRAND
# plate column 11 (slot 1) is printed once onto the matching row of paper
# column 3 (slot 5):
#
#   A11 -> A3    B11 -> B3    C11 -> C3    D11 -> D3
#   E11 -> E3    F11 -> F3    G11 -> G3    H11 -> H3
#
# 8 deposits x 5 uL = 40 uL total, 5 uL drawn from each dilution well. There
# is no further dilution, stacking, or drying delay.
#
# IMPORTANT: scripts 24 and 25 replace combined script 23. Do not run script 23
# and these split scripts on the same paper unless duplicate deposits are wanted.
#
# SIMULATION LAPTOP (build + local simulation only):
#   conda activate ai
#   python scripts/build_print_from_vial.py --config configs/experiments/25_column11_dilutions_to_paper5_column3.yaml
#
# REAL ROBOT LAPTOP (after review, commit/push, and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py column11-paper5-column3 --robot-ip 169.254.46.57 --live
#
# Script 24 finishes at B6. This script starts at C6 and dedicates one tip to
# each source: C6, D6, E6, F6, G6, H6, A7, and B7.

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: column11_dilutions_to_paper5_column3

# The generated protocol moves liquid. The named runner requires --live.
run_modes: {dry_run: false}

# --- sources: eight prepared dilutions in the BRAND plate, slot 1 ------------
source:
  type: well_plate
  slot: 1
  wells: [A11, B11, C11, D11, E11, F11, G11, H11]
  material: column-11 dilution series
  loaded_volume_ul: 100.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destination: paper in slot 5 --------------------------------------------
substrate:
  slot: 5

printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  inter_layer_delay_s: 0.0

print_groups:
  # Bind slot 5 explicitly to the intended row-specific plate source.
  - {source_well: A11, source_wells: {5: A11}, targets: [A3], droplets: 1}
  - {source_well: B11, source_wells: {5: B11}, targets: [B3], droplets: 1}
  - {source_well: C11, source_wells: {5: C11}, targets: [C3], droplets: 1}
  - {source_well: D11, source_wells: {5: D11}, targets: [D3], droplets: 1}
  - {source_well: E11, source_wells: {5: E11}, targets: [E3], droplets: 1}
  - {source_well: F11, source_wells: {5: F11}, targets: [F3], droplets: 1}
  - {source_well: G11, source_wells: {5: G11}, targets: [G3], droplets: 1}
  - {source_well: H11, source_wells: {5: H11}, targets: [H3], droplets: 1}

tips:
  pipette_tip_reuse: true
  print_tip: C6
  return_tips: true

