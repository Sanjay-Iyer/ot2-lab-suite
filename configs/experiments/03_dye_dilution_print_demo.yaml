# 03 - DYE DILUTION + STANDARD PRINT + ONE CLOVER (first real dye experiment)
#
#   5x dye dilution in the BRAND plate, then print from the diluted well.
#
#   configs/experiments/03_dye_dilution_print_demo.yaml   <- edit this
#        |  build (validate + flatten with the referenced machine profile)
#        v
#   src/protocols/generated/03_dye_dilution_print_demo_latest.py  <- uploaded
#
# Real run (rebuilds fresh from this file, then uploads + plays):
#   python scripts/run_printing_experiment_robot.py dye-demo

# Laboratory-owned pipette, paper labware identity, tiprack, and the validated
# print-release air handling. Deck slots below override where things sit today.
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: dye_dilution_print_demo

# DEFAULT IS LIVE. This is a real physical instrument test.
run_modes: {dry_run: false}

# true  -> ONE tip held for every deposit drawn from the same source well
#          (all standard + all clover printing from B11 on a single tip)
# false -> fresh tip for every individual deposit (use for clean data runs)
pipette_tip_reuse: true

# --- dye source: BRAND 781662 plate, slot 1 ------------------------------------
dye_source:
  labware: brand_96_wellplate_350ul_flat_781662
  slot: 1
  well: A11
  loaded_volume_ul: 300
  aspirate_height_mm: 1.0

# --- water source: 20 mL vial rack, slot 7 -------------------------------------
water_source:
  labware: tuberack_3dprint_20ml_8vials_v2
  slot: 7
  well: A1
  material: water
  aspirate_height_mm: 4.0

# --- the 5x dilution: PREPARED BY HAND ------------------------------------------
# enabled: false -> the robot performs NO dye transfer, NO water transfer and NO
# mix. B11 must already contain the finished dilution when the run starts.
#
#   PREPARE BEFORE THE RUN:  60 uL dye + 240 uL water = 300 uL in B11
#
# Set enabled: true to have the robot build the dilution itself again.
dilution:
  enabled: false
  destination_well: B11
  dye_volume_ul: 60
  water_volume_ul: 240
  total_volume_ul: 300        # what B11 holds at the start of the run
  transfer_chunk_ul: 20       # P20 maximum per water transfer (unused while disabled)
  mix_cycles: 5               # unused while disabled
  mix_volume_ul: 15           # unused while disabled
  dispense_height_mm: 2.0
  minimum_remaining_ul: 10    # keep this much in B11 after printing

# --- paper substrate ------------------------------------------------------------
paper:
  slot: 11

# --- printing behaviour ---------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0
  # Aspiration height inside the DILUTED well (B11) for every printed droplet,
  # standard and clover alike. B11 drains 300 uL -> ~240 uL over the run; in a
  # 6.94 mm well that is roughly 7.9 mm -> 6.3 mm of liquid, so 0.5 mm keeps
  # the tip well submerged throughout without touching the flat bottom.
  source_aspirate_height_mm: 0.5

# --- standard print: 8 spots down paper column 1 --------------------------------
# enabled: false -> skipped entirely this run (clover only). Set true to restore.
standard_print:
  enabled: false
  source_well: B11
  targets: [A1, B1, C1, D1, E1, F1, G1, H1]
  droplets_per_target: 1

# --- clover print: one four-droplet clover near column 3 ------------------------
# Existing d1..d4 geometry: half_width/half_height are offsets FROM the centre,
# so opposing droplets end up twice that far apart (2.0 -> 4.0 mm apart).
clover_print:
  source_well: B11
  reference: D3               # lower in column 3; B3 already has a spot on it
  clovers: 1
  # These are offsets FROM THE CENTRE, so opposing droplets end up TWICE this
  # far apart: 2.5 -> 5.0 mm horizontal and 5.0 mm vertical separation.
  half_width_mm: 2.5
  half_height_mm: 2.5
  x_offset_mm: 0.0
  y_offset_mm: 0.0

# --- tips -----------------------------------------------------------------------
tips:
  start_tip: A1               # first P20 tiprack position to consume
  return_tips: false           # false -> drop used tips in the trash
