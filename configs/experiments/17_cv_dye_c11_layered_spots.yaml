# =============================================================================
# 17 - CV DYE OVER THE LAYERED SPOTS: BRAND C11 -> slots 5 and 11
# =============================================================================
# The finish for run 16. Once the nanoparticle build-up is done, this holds for
# TWO HOURS with no tip attached and no motion, then puts one 5 uL drop of CV
# dye on every position that received extra nanoparticle layers:
#
#   E2 (row 5)   built up to 4 nanoparticle drops
#   F2 (row 6)   built up to 10 nanoparticle drops
#
# Nothing else is touched. A1/B1/C1 already carry the B11 dye from run 14, and
# D1/G1/H1 never received extra layers.
#
# Execution order is target-then-paper, so each position is deposited on slot 5
# and then slot 11 before advancing:
#
#   E2(5) E2(11) F2(5) F2(11)
#
# 2 targets x 2 sheets x 1 drop x 5 uL = 4 deposits, 20 uL total
#                                        (10 uL per paper sheet)
#
# Single layer, so no inter-layer delay ever fires -- the only wait is the
# two-hour hold at the start.
#
#   python scripts/run_printing_experiment_robot.py cv-dye-layered-spots
#
# ---------------------------------------------------------------------------
# RUN THIS IMMEDIATELY AFTER 16 FINISHES. The two-hour hold is built in as
# initial_delay_s, so start it as soon as run 16 ends and the robot waits for
# you. If you would rather wait yourself and start it later, set
# initial_delay_s to 0 and run it two hours after 16 completes.
#
# The hold happens BEFORE any tip is picked up: the arm simply sits idle for the
# full two hours, so no tip is left loaded or drying out during the wait.
#
# TIP: E1 -- the next clean tip. A1 and D1 carry nanoparticle residue, B1 the
# B11 dye, C1 the B10 stock. CV dye gets its own tip.
# ---------------------------------------------------------------------------

machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: cv_dye_c11_layered_spots

# DEFAULT IS LIVE. Real physical instrument test.
run_modes: {dry_run: false}

# --- source: CV dye in the BRAND 781662 plate, slot 1 --------------------------
source:
  type: well_plate
  slot: 1
  wells: [C11]                # <- the CV dye
  material: CV dye
  # The run draws 20 uL and holds 20 uL back, so C11 must contain at least
  # 40 uL at start. Raise this to match what is actually in C11.
  loaded_volume_ul: 100.0
  minimum_remaining_ul: 20.0
  aspirate_height_mm: 0.5

# --- destinations: matching paper sheets in slots 5 and 11 ---------------------
substrate:
  slots: [5, 11]

# --- printing behaviour --------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0     # no pause between individual droplets
  inter_layer_delay_s: 0.0    # unused: there is only one layer
  initial_delay_s: 7200.0     # TWO HOURS of drying after run 16, before any
                              # tip is picked up and before the first drop

# --- what to print -------------------------------------------------------------
# One group, one layer: exactly the two positions run 16 built up.
print_groups:
  - source_well: C11
    targets: [E2, F2]
    droplets: 1

# --- tip behaviour -------------------------------------------------------------
# One source well, so a single tip is held for both sheets and the whole run.
# E1 -- see the tip note in the header before changing this.
tips:
  pipette_tip_reuse: true
  print_tip: E1
  return_tips: true
