# 01a - STANDARD PRINT from the EXISTING Corning 96-well plate
#
# source liquid -> aspirate -> air gap -> paper target -> dispense.
# No dilution, no intermediate plate preparation.
#
#   configs/experiments/01_print_from_corning_plate.yaml   <- edit this
#        |  build (validate + flatten with the referenced machine profile)
#        v
#   src/protocols/generated/01_print_from_vial_latest.py  <- uploaded to the OT-2
#
# Real run (rebuilds fresh from this file, then uploads + plays):
#   python scripts/run_printing_experiment_robot.py print-from-corning-plate

# Laboratory-owned paper/tiprack geometry, calibrated heights, and the validated
# print-release air handling (including the anti-drip air gap on EVERY cycle).
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

protocol_label: standard_print_corning_plate

# DEFAULT IS LIVE. These configs are for real physical instrument tests.
run_modes: {dry_run: false}

# --- source liquid -------------------------------------------------------------
# type: vial_rack  -> tuberack_3dprint_20ml_8vials_v2, default slot 7 (A1-A4/B1-B4)
# type: well_plate -> brand_96_wellplate_350ul_flat_781662, default slot 4 (A1-H12)
# `slot` and `aspirate_height_mm` may be overridden; labware identity may not.
source:
  type: corning_plate         # corning_96_wellplate_360ul_custom, slot 4
  slot: 4
  wells: [A1]                 # any well A1-H12; change freely
  material: print test liquid
  loaded_volume_ul: 300.0
  minimum_remaining_ul: 20.0

# To use the BRAND plate instead, replace the block above with:
# source:
#   type: well_plate
#   slot: 4
#   wells: [A1]
#   material: print test liquid (diluent)
#   loaded_volume_ul: 300.0
#   minimum_remaining_ul: 20.0

# --- printing behaviour ---------------------------------------------------------
printing:
  droplet_volume_ul: 5.0
  inter_drop_delay_s: 0.0     # pause after each individual droplet
  inter_layer_delay_s: 5.0    # DRYING pause between layers/rounds

# --- what to print ---------------------------------------------------------
# Execution is LAYER BY LAYER across all groups, not target by target:
#   layer 1: A1, B1, C1 (1 drop each), then A2, B2, C2 (drop 1 of 3)
#   wait inter_layer_delay_s
#   layer 2: A2, B2, C2 (drop 2 of 3)
#   wait inter_layer_delay_s
#   layer 3: A2, B2, C2 (drop 3 of 3)
# A group with droplets: 1 participates only in layer 1.
# source_well is optional; it defaults to the first entry in source.wells.
print_groups:
  - source_well: A1
    targets: [A1, B1, C1]
    droplets: 1

  - source_well: A1
    targets: [A2, B2, C2]
    droplets: 3

# --- tip behaviour ---------------------------------------------------------
# One tip per distinct source well. A tip that has been in one source liquid is
# never put into another; identical source across groups reuses the same tip for
# every target and every layer.
tips:
  pipette_tip_reuse: true   # true -> reuse one tip per source well (fewest tips)
                            # false -> fresh tip for EVERY source->paper deposit
  print_tip: A1        # first P20 tiprack position to use
  return_tips: true     # true -> return_tip(), false -> drop_tip()
