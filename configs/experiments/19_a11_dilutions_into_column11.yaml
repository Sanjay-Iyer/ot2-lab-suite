# =============================================================================
# 19 - DILUTE BRAND A11 (slot 1) DOWN THE REST OF COLUMN 11, 300 uL PER WELL
# =============================================================================
# The stock is already on the plate and is NOT adjusted by this run: BRAND A11
# in slot 1, holding ~240 uL made as 120 uL dye + 120 uL water. A11 is therefore
# ALREADY A 2x DILUTION of the concentrated dye. Water comes from vial-rack A1
# (slot 7).
#
# Each of the seven wells below A11 is filled to 300 uL, drawn DIRECTLY from
# A11 -- not serially, so an error in one well does not propagate to the next.
#
#   well  factor vs A11   from A11    water        absolute vs neat dye
#   B11        5x          60.0 uL    240.0 uL            10x
#   C11       10x          30.0 uL    270.0 uL            20x
#   D11       20x          15.0 uL    285.0 uL            40x
#   E11       30x          10.0 uL    290.0 uL            60x
#   F11       50x           6.0 uL    294.0 uL           100x
#   G11      100x           3.0 uL    297.0 uL           200x
#   H11      200x           1.5 uL    298.5 uL           400x
#
# The "absolute" column is the dilution relative to the neat dye, and is simply
# 2x the factor because A11 is itself 2x. Every stock volume is a round number,
# so nothing depends on the pipette hitting an awkward fractional target.
#
# ---------------------------------------------------------------------------
# WHY THE SERIES STARTS AT 5x AND NOT 2x
#
# A11 holds 240 uL. The tip aspirates at a fixed 0.5 mm over a 6.94 mm flat
# well floor, which sits at the 18.9 uL mark, so only ~221 uL of the 240 uL is
# physically reachable. At 300 uL per well a 2x point alone would need 150 uL,
# and the old 2x-to-100x series would need 274 uL -- over budget, and the run
# would run A11 dry partway through.
#
# Shifting every point one step deeper costs 125.5 uL of the 221 uL budget, a
# ~95 uL margin, so the "about 120 + 120" estimate for A11 does not have to be
# exact. It also reaches 200x, which the old 100 uL wells could not: at 300 uL
# a 200x point is a 1.5 uL pull, comfortably above the 1.0 uL P20 floor.
# ---------------------------------------------------------------------------
#
# TOTAL CONSUMPTION: 125.5 uL out of A11 and 1974.5 uL (~2.0 mL) of water.
# This protocol only makes dilutions. It does not print.
#
# RUNTIME: the P20 moves everything in <=18 uL bites, and this run places
# 2100 uL, so expect ~124 aspirate/dispense cycles and roughly 20 minutes.
# That is inherent to a 20 uL pipette placing 2 mL; it is not a fault.
#
# REAL ROBOT LAPTOP (after review and pull):
#   conda activate llm
#   python scripts/run_printing_experiment_robot.py a11-column11-dilutions --live
#
# No --robot-host: resolve_host() walks OT2_ROBOT_HOST -> mDNS
# (OT2CEP20220929R02.local) -> cached -> discovery, which tracks the robot's
# actual address. Do NOT paste a 169.254.x.x literal in here -- it is
# link-local and renegotiated per boot, and the repo already carries two
# conflicting ones (see docs/architecture/STAGE0_BASELINE.md).
#
# BEFORE RUNNING:
#   * Do NOT run add-dye. A11 is the intended starting point exactly as it is;
#     topping it up would change the concentration every factor below refers to.
#   * B11:H11 must all be EMPTY. Each finished well holds 300 uL and the BRAND
#     well caps at 350 uL, so there is only 50 uL of slack -- residue in a
#     destination well throws off both its volume and its concentration.
#   * Vial-rack A1 needs at least 4.5 mL of water: 1974.5 uL consumed plus the
#     ~2.5 mL that just submerges the tip at the 4.0 mm aspirate height in a
#     28 mm bore vial.
#   * Use a fresh P20 rack, or confirm A1 is clean. The run now consumes ONE
#     tip (see below) and drops it in the trash at the end.
#
# ---------------------------------------------------------------------------
# SINGLE-TIP MODE IS ON (tips.single_tip_all_sources: true), BY REQUEST.
#
# This run used to take 21 tips: water, stock and mix each got their own tip
# per well, so the tip never carried liquid from one well into another. It now
# takes a single tip for the whole run.
#
# WHAT THAT TIP DOES, IN ORDER, FOR EACH OF B11..H11:
#   1. aspirates water from vial-rack A1
#   2. aspirates 2x stock from A11
#   3. mixes the finished dilution, submerged in it at 2.0 mm
#   ...then goes straight back to step 1 for the next well.
#
# CONSEQUENCE, ACCEPTED KNOWINGLY: from the second well onward the tip carries
# dye residue back into BOTH shared reservoirs -- the ~4 mL water vial A1 and
# the A11 stock that every factor below is defined against. The water stops
# being water and A11 stops being a clean 2x, so the later wells in the series
# are more concentrated than their stated factor, by an amount nothing here
# measures. The dispense height (2.0 mm) sits below the 7.93 mm liquid surface,
# so the tip is submerged on every dispense; this is not avoidable by skipping
# the mix step.
#
# Do not treat vial A1 as clean water or A11 as a clean 2x stock after this
# run. If the series concentrations need to be trustworthy, set
# single_tip_all_sources back to false and accept the 21 tips.
# ---------------------------------------------------------------------------

protocol_label: a11_dilutions_column11

# The generated protocol moves liquid. The named runner also requires --live.
run_modes: {dry_run: false}

pipette_tip_reuse: true

# --- stock: the 2x dye already sitting in BRAND A11, slot 1 -------------------
# Same labware as the destination. The executor loads each deck slot once, so
# stock and destination legitimately share the slot 1 plate.
source:
  labware: brand_96_wellplate_350ul_flat_781662
  slot: 1
  well: A11
  material: dye stock in A11 (2x -- 120 uL dye + 120 uL water)
  # 0.5 mm, not the registered 1.0 mm default: A11 gets drawn down over the run
  # and the flat well is only 10.65 mm deep. Do not go lower.
  aspirate_height_mm: 0.5

# --- water --------------------------------------------------------------------
diluent:
  labware: tuberack_3dprint_20ml_8vials_v2
  slot: 7
  well: A1
  material: water
  aspirate_height_mm: 4.0

# --- seven finished dilutions, top to bottom below A11 -------------------------
destination:
  labware: brand_96_wellplate_350ul_flat_781662
  slot: 1
  wells: [B11, C11, D11, E11, F11, G11, H11]
  aspirate_height_mm: 0.5
  # 2.0 mm. The finished 300 uL stands 7.93 mm deep, so the tip ends up well
  # submerged -- which is what the mix step needs, since it mixes at this same
  # height. Do not raise this above ~7 mm or the mix would aspirate air.
  dispense_height_mm: 2.0

dilution:
  mode: factors
  factors: [5, 10, 20, 30, 50, 100, 200]
  total_volume_ul: 300
  # 18 uL leaves room for the 1.5 uL trailing air gap in the 20 uL P20.
  transfer_chunk_ul: 18
  mix_cycles: 5
  mix_volume_ul: 15

liquid_handling:
  air_gap_ul: 1.5
  air_gap_height_mm: 5.0

tips:
  start_tip: A1
  # Requested: one tip for the entire dilution run rather than one per source.
  # Requires pipette_tip_reuse: true. See the SINGLE-TIP MODE note above for
  # the reservoir cross-contamination this accepts.
  single_tip_all_sources: true
  return_tips: false
