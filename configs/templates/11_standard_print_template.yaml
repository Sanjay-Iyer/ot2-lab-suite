# =============================================================================
# TEMPLATE - VERSION 11 STANDARD PAPER PRINT  (11_standard_print)
# =============================================================================
# Copy this file, edit the copy, and build it:
#
#   from src.printing.v11.standard_loader import load_standard_print_config
#   from src.printing.v11.standard_builder import build_and_simulate
#   config, run_modes = load_standard_print_config("configs/generated/my_print.yaml")
#   built, passed, output = build_and_simulate(config, run_modes=run_modes)
#
# Printing only. Make any dilution separately with the dilution workflow first.
# Every parameter below is documented in configs/templates/11_parameter_reference.yaml,
# which is the contract this template, its loader and its executor all follow.
#
# The defaults in this file reproduce the physically validated Version 1
# behaviour exactly: a 20 mL vial in slot 7, paper in slot 11, one 5 uL droplet
# on each of A1-H1, one tip held for the whole run.
# =============================================================================

schema_version: 1
workflow: 11_standard_print
protocol_label: standard_print

# Laboratory-owned. Supplies the pipette, the tiprack slot and the validated
# droplet release behaviour (pre-air chase, push-out, blow-out). Never invent
# values for these; changing them requires physical revalidation.
machine_profile: configs/machines/ot2_standard_printing_p20_v1.yaml

# DEFAULT IS LIVE. dry_run: true plans and validates without moving the arm.
run_modes:
  dry_run: false
  do_print: true

# --- where the liquid comes from ---------------------------------------------
# type: vial_rack     -> tuberack_3dprint_20ml_8vials_v2      (usual slot 7)
# type: corning_plate -> corning_96_wellplate_360ul_custom    (usual slot 4)
# type: well_plate    -> brand_96_wellplate_350ul_flat_781662 (usual slot 1)
source:
  type: vial_rack
  slot: 7
  wells: [A1]                 # groups pick their source_well from this list
  material: print liquid
  loaded_volume_ul: 5000.0    # what the operator physically loaded
  minimum_remaining_ul: 100.0 # refuse to plan a run that drains below this
  aspirate_height_mm: 4.0     # 4.0 for the vial rack, ~1.0 for a plate well

# --- which paper to print on --------------------------------------------------
paper:
  slot: 11                    # slot 5 and slot 11 both hold paper today
  # KEY EXPERIMENTAL PARAMETER: height above the paper surface the droplet is
  # released from. 0.5 mm is the physically confirmed release height; larger
  # values left drops hanging on the tip in earlier testing.
  print_height_mm: 0.5

# --- printing behaviour -------------------------------------------------------
printing:
  droplet_volume_ul: 5.0      # droplet + air_gap_ul must fit the 20 uL P20
  # layer_major  (default) every target gets layer 1, wait, then layer 2 ...
  # target_major one target receives all of its droplets before the next.
  order: layer_major
  droplets_per_target: 1      # default droplet count for groups that omit it

# --- what to print ------------------------------------------------------------
# Give explicit `targets:`, or a convenience `target_selection:` that the loader
# resolves into explicit wells before anything reaches the robot:
#   target_selection: {column: 3}                 -> A3 B3 C3 D3 E3 F3 G3 H3
#   target_selection: {column: 3, rows: [A, B, C]}-> A3 B3 C3
#   target_selection: {row: B, columns: [1, 2, 3]}-> B1 B2 B3
# Top-level targets are INHERITED by any group that declares none. This template
# states its targets inside `groups` below, so nothing is declared here -- having
# both is how a config starts lying about what it actually prints.
# targets: [A1, B1, C1, D1, E1, F1, G1, H1]
# target_selection: {column: 1}

# Repeat the whole resolved target list this many times. Resolved into explicit
# repeated positions by the loader; it never invents a coordinate.
replicates: 1

# Groups let different paper targets draw from different source wells and take
# different droplet counts. Each entry may set source_well, targets (or
# target_selection), droplets and replicates; anything omitted is inherited from
# the top-level values above.
#
#   groups:
#     - source_well: A1
#       targets: [A1, B1, C1]
#       droplets: 1
#     - source_well: A2
#       target_selection: {column: 2}
#       droplets: 3
groups:
  - source_well: A1
    targets: [A1, B1, C1, D1, E1, F1, G1, H1]
    droplets: 1

# --- timing -------------------------------------------------------------------
timing:
  inter_drop_delay_s: 0.0     # pause after each individual droplet
  inter_layer_delay_s: 5.0    # DRYING pause between stacked layers
  inter_target_delay_s: 0.0   # pause when moving to a new target position

# --- pipetting ----------------------------------------------------------------
# air_gap_ul is taken AFTER the liquid: anti-drip in transit only. It cannot help
# droplet release - that is what the machine profile's push-out and blow-out do.
pipetting:
  aspirate_flow_rate_ul_s: 3.0
  dispense_flow_rate_ul_s: 3.0
  air_gap_ul: 1.5
  air_gap_height_mm: 5.0      # lift above the well before taking the gap
  post_aspirate_delay_s: 0.0  # settle time after aspirating, before moving
  post_dispense_delay_s: 0.0  # settle time after dispensing, before the next move

# --- tips ---------------------------------------------------------------------
# true  -> one tip per distinct source well, held across all targets and layers
# false -> a fresh tip for every single deposit
tips:
  pipette_tip_reuse: true
  return_tips: true           # false drops used tips in the trash
  start_tip: A1
